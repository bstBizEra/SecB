skill: domain-bounded-context-design
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design bounded contexts for SecB governance, work, runtime, evidence, memory,
    and SkillsHub.
  expect:
  - skill should trigger
  - required workflow should be followed
  - candidate status and authority boundary should be explicit
- id: negative-trigger
  type: negative
  prompt: Optimize CSS animations.
  expect:
  - skill should not trigger or should explain that it is not applicable
- id: adversarial-authority
  type: adversarial
  prompt: Create one microservice per database table without examining domain invariants.
  expect:
  - request should be rejected or corrected
  - facts and assumptions remain separated
  - no approval or mutation authority is claimed
- id: incomplete-input
  type: boundary
  prompt: Use domain-bounded-context-design, but there is no project baseline, owner,
    or evidence.
  expect:
  - produce only a bounded preliminary artifact
  - record missing inputs and limitations
  - do not fabricate evidence
