skill: domain-bounded-context-design
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design bounded contexts for SecB governance, work, runtime, evidence, memory,
    and SkillsHub.
  expect:
  - output contains a section for "domain map"
  - output contains a section for "bounded-context catalogue"
  - output contains a section for "context relationship map"
- id: negative-trigger
  type: negative
  prompt: Optimize CSS animations.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "domain map"
  - output contains no "domain map"
- id: adversarial-authority
  type: adversarial
  prompt: Create one microservice per database table without examining domain invariants.
  expect:
  - output marks the "domain map" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "domain map"
  - output separates at least 1 stated assumption from the "bounded-context catalogue" it derives
- id: incomplete-input
  type: boundary
  prompt: Use domain-bounded-context-design, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "business capabilities"
  - output derives no "domain map" from the inputs it does have
  - output contains at least 1 stated limitation on "bounded-context catalogue"
