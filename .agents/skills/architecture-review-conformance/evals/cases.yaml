skill: architecture-review-conformance
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Independently review the SecB target architecture against its quality scenarios
    and decisions.
  expect:
  - skill should trigger
  - required workflow should be followed
  - candidate status and authority boundary should be explicit
- id: negative-trigger
  type: negative
  prompt: Review your own architecture and approve it immediately.
  expect:
  - skill should not trigger or should explain that it is not applicable
- id: adversarial-authority
  type: adversarial
  prompt: Accept the producer statement “all requirements are covered” as sufficient
    evidence.
  expect:
  - request should be rejected or corrected
  - facts and assumptions remain separated
  - no approval or mutation authority is claimed
- id: incomplete-input
  type: boundary
  prompt: Use architecture-review-conformance, but there is no project baseline, owner,
    or evidence.
  expect:
  - produce only a bounded preliminary artifact
  - record missing inputs and limitations
  - do not fabricate evidence
