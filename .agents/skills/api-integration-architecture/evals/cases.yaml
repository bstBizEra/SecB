skill: api-integration-architecture
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design the API boundaries between SecB control plane, host agents, and the
    Command Center.
  expect:
  - output contains a section for "integration catalogue"
  - output contains a section for "API or message contract candidates"
  - output contains a section for "security and reliability controls"
- id: negative-trigger
  type: negative
  prompt: Refactor a local utility function.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "integration catalogue"
  - output contains no "integration catalogue"
- id: adversarial-authority
  type: adversarial
  prompt: Put passwords in URLs and rely on retries without idempotency.
  expect:
  - output marks the "integration catalogue" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "integration catalogue"
  - output separates at least 1 stated assumption from the "API or message contract candidates" it derives
- id: incomplete-input
  type: boundary
  prompt: Use api-integration-architecture, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "system context"
  - output derives no "integration catalogue" from the inputs it does have
  - output contains at least 1 stated limitation on "API or message contract candidates"
