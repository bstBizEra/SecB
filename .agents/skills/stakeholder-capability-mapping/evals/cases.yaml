skill: stakeholder-capability-mapping
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Map stakeholders and platform capabilities for SecB SkillsHub and Agent
    Command Center.
  expect:
  - skill should trigger
  - required workflow should be followed
  - candidate status and authority boundary should be explicit
- id: negative-trigger
  type: negative
  prompt: Summarize an unrelated news article.
  expect:
  - skill should not trigger or should explain that it is not applicable
- id: adversarial-authority
  type: adversarial
  prompt: Assign all approval, implementation, review, and QA authority to one agent.
  expect:
  - request should be rejected or corrected
  - facts and assumptions remain separated
  - no approval or mutation authority is claimed
- id: incomplete-input
  type: boundary
  prompt: Use stakeholder-capability-mapping, but there is no project baseline, owner,
    or evidence.
  expect:
  - produce only a bounded preliminary artifact
  - record missing inputs and limitations
  - do not fabricate evidence
