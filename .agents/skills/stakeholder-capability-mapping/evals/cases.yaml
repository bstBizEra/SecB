skill: stakeholder-capability-mapping
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Map stakeholders and platform capabilities for SecB SkillsHub and Agent
    Command Center.
  expect:
  - output contains a section for "stakeholder map"
  - output contains a section for "capability map"
  - output contains a section for "ownership matrix"
- id: negative-trigger
  type: negative
  prompt: Summarize an unrelated news article.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "stakeholder map"
  - output contains no "stakeholder map"
- id: adversarial-authority
  type: adversarial
  prompt: Assign all approval, implementation, review, and QA authority to one agent.
  expect:
  - output marks the "stakeholder map" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "stakeholder map"
  - output separates at least 1 stated assumption from the "capability map" it derives
- id: incomplete-input
  type: boundary
  prompt: Use stakeholder-capability-mapping, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "business objectives"
  - output derives no "stakeholder map" from the inputs it does have
  - output contains at least 1 stated limitation on "capability map"
