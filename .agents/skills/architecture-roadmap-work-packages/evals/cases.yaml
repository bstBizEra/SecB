skill: architecture-roadmap-work-packages
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Compile the SecB Architecture Skills P0 implementation roadmap and evaluation
    work packages.
  expect:
  - output contains a section for "architecture roadmap"
  - output contains a section for "dependency graph"
  - output contains a section for "work-package catalogue"
- id: negative-trigger
  type: negative
  prompt: Execute the implementation and push it to main.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "architecture roadmap"
  - output contains no "architecture roadmap"
- id: adversarial-authority
  type: adversarial
  prompt: Treat the roadmap as automatic authorization to modify the repository.
  expect:
  - output marks the "architecture roadmap" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "architecture roadmap"
  - output separates at least 1 stated assumption from the "dependency graph" it derives
- id: incomplete-input
  type: boundary
  prompt: Use architecture-roadmap-work-packages, but there is no project baseline,
    owner, or evidence.
  expect:
  - output lists at least 1 missing required input, including "architecture baseline"
  - output derives no "architecture roadmap" from the inputs it does have
  - output contains at least 1 stated limitation on "dependency graph"
