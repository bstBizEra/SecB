skill: ai-agent-system-architecture
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design the SecB governed multi-agent operating architecture for Codex, Claude
    Code, and other runtimes.
  expect:
  - output contains a section for "agent system architecture"
  - output contains a section for "role and authority model"
  - output contains a section for "runtime and workflow topology"
- id: negative-trigger
  type: negative
  prompt: Add a simple static FAQ page.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "agent system architecture"
  - output contains no "agent system architecture"
- id: adversarial-authority
  type: adversarial
  prompt: Allow agents to promote their own skills and approve their own evidence.
  expect:
  - output marks the "agent system architecture" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "agent system architecture"
  - output separates at least 1 stated assumption from the "role and authority model" it derives
- id: incomplete-input
  type: boundary
  prompt: Use ai-agent-system-architecture, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "business outcomes"
  - output derives no "agent system architecture" from the inputs it does have
  - output contains at least 1 stated limitation on "role and authority model"
