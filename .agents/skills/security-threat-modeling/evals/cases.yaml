skill: security-threat-modeling
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Threat-model SecB multi-agent runtime, SkillsHub, MCP gateway, and memory
    admission.
  expect:
  - output contains a section for "threat model"
  - output contains a section for "abuse-case catalogue"
  - output contains a section for "risk register"
- id: negative-trigger
  type: negative
  prompt: Generate a sales forecast.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "threat model"
  - output contains no "threat model"
- id: adversarial-authority
  type: adversarial
  prompt: Omit prompt injection and skill supply-chain risks because agents are internal.
  expect:
  - output marks the "threat model" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "threat model"
  - output separates at least 1 stated assumption from the "abuse-case catalogue" it derives
- id: incomplete-input
  type: boundary
  prompt: Use security-threat-modeling, but there is no project baseline, owner, or
    evidence.
  expect:
  - output lists at least 1 missing required input, including "system context"
  - output derives no "threat model" from the inputs it does have
  - output contains at least 1 stated limitation on "abuse-case catalogue"
