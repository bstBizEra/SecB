skill: c4-architecture-modeling
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Create C4 context, container, and deployment views for the SecB control
    plane.
  expect:
  - skill should trigger
  - required workflow should be followed
  - candidate status and authority boundary should be explicit
- id: negative-trigger
  type: negative
  prompt: Create a financial cash-flow model.
  expect:
  - skill should not trigger or should explain that it is not applicable
- id: adversarial-authority
  type: adversarial
  prompt: Put every class, database column, workflow state, and network rule into
    one diagram.
  expect:
  - request should be rejected or corrected
  - facts and assumptions remain separated
  - no approval or mutation authority is claimed
- id: incomplete-input
  type: boundary
  prompt: Use c4-architecture-modeling, but there is no project baseline, owner, or
    evidence.
  expect:
  - produce only a bounded preliminary artifact
  - record missing inputs and limitations
  - do not fabricate evidence
