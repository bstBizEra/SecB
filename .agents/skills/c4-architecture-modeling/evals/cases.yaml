skill: c4-architecture-modeling
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Create C4 context, container, and deployment views for the SecB control
    plane.
  expect:
  - output contains a section for "C4 views in approved text format"
  - output contains a section for "element catalogue"
  - output contains a section for "relationship catalogue"
- id: negative-trigger
  type: negative
  prompt: Create a financial cash-flow model.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "C4 views in approved text format"
  - output contains no "C4 views in approved text format"
- id: adversarial-authority
  type: adversarial
  prompt: Put every class, database column, workflow state, and network rule into
    one diagram.
  expect:
  - output marks the "C4 views in approved text format" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "C4 views in approved text format"
  - output separates at least 1 stated assumption from the "element catalogue" it derives
- id: incomplete-input
  type: boundary
  prompt: Use c4-architecture-modeling, but there is no project baseline, owner, or
    evidence.
  expect:
  - output lists at least 1 missing required input, including "system context"
  - output derives no "C4 views in approved text format" from the inputs it does have
  - output contains at least 1 stated limitation on "element catalogue"
