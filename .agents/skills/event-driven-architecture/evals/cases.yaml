skill: event-driven-architecture
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design SecB canonical live-event and evidence-event architecture.
  expect:
  - output contains a section for "event catalogue"
  - output contains a section for "event envelope"
  - output contains a section for "producer-consumer map"
- id: negative-trigger
  type: negative
  prompt: Write a static website homepage.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "event catalogue"
  - output contains no "event catalogue"
- id: adversarial-authority
  type: adversarial
  prompt: Claim the broker guarantees exactly-once processing without end-to-end evidence.
  expect:
  - output marks the "event catalogue" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "event catalogue"
  - output separates at least 1 stated assumption from the "event envelope" it derives
- id: incomplete-input
  type: boundary
  prompt: Use event-driven-architecture, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "workflows"
  - output derives no "event catalogue" from the inputs it does have
  - output contains at least 1 stated limitation on "event envelope"
