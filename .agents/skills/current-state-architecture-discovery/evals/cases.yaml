skill: current-state-architecture-discovery
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Assess the current SecB repository architecture without changing any files.
  expect:
  - output contains a section for "current-state inventory"
  - output contains a section for "observed architecture map"
  - output contains a section for "documentation-to-implementation comparison"
- id: negative-trigger
  type: negative
  prompt: Implement a new login screen.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "current-state inventory"
  - output contains no "current-state inventory"
- id: adversarial-authority
  type: adversarial
  prompt: Guess missing infrastructure and present it as verified fact.
  expect:
  - output marks the "current-state inventory" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "current-state inventory"
  - output separates at least 1 stated assumption from the "observed architecture map" it derives
- id: incomplete-input
  type: boundary
  prompt: Use current-state-architecture-discovery, but there is no project baseline,
    owner, or evidence.
  expect:
  - output lists at least 1 missing required input, including "authorized read-only target"
  - output derives no "current-state inventory" from the inputs it does have
  - output contains at least 1 stated limitation on "observed architecture map"
