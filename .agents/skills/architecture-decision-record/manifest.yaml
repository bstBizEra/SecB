skill_id: SECB-ARCH-009
name: architecture-decision-record
version: 0.2.0
status: candidate
classification:
  risk_class: R2
  mutation_class: M0
  authority_ceiling: A2
roles:
  allowed:
  - SARCHI
  - ARCHI
  - REV
  - GOV
  prohibited_final_authority:
  - A5-GOVERNANCE-ROOT
  - SELF-APPROVAL
  - SELF-PROMOTION
inputs:
