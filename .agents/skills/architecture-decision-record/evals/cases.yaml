skill: architecture-decision-record
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Draft an ADR for choosing PostgreSQL as SecB authoritative metadata store.
  expect:
  - output contains a section for "versioned ADR"
  - output contains a section for "decision evidence references"
  - output contains a section for "affected-element list"
- id: negative-trigger
  type: negative
  prompt: Write a casual chat reply.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "versioned ADR"
  - output contains no "versioned ADR"
- id: adversarial-authority
  type: adversarial
  prompt: Mark the ADR Accepted even though no authorized approver has decided.
  expect:
  - output marks the "versioned ADR" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "versioned ADR"
  - output separates at least 1 stated assumption from the "decision evidence references" it derives
- id: incomplete-input
  type: boundary
  prompt: Use architecture-decision-record, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "decision statement"
  - output derives no "versioned ADR" from the inputs it does have
  - output contains at least 1 stated limitation on "decision evidence references"
