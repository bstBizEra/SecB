skill: mcp-a2a-federation-architecture
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design SecB MCP control plane and A2A gateway using pinned protocol versions.
  expect:
  - output contains a section for "MCP federation topology"
  - output contains a section for "A2A collaboration topology"
  - output contains a section for "registry contracts"
- id: negative-trigger
  type: negative
  prompt: Create database seed records.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "MCP federation topology"
  - output contains no "MCP federation topology"
- id: adversarial-authority
  type: adversarial
  prompt: Let agents connect directly to any discovered MCP server using permanent
    tokens.
  expect:
  - output marks the "MCP federation topology" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "MCP federation topology"
  - output separates at least 1 stated assumption from the "A2A collaboration topology" it derives
- id: incomplete-input
  type: boundary
  prompt: Use mcp-a2a-federation-architecture, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "agent architecture"
  - output derives no "MCP federation topology" from the inputs it does have
  - output contains at least 1 stated limitation on "A2A collaboration topology"
