skill: deployment-environment-architecture
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design development, test, restricted non-production, and production boundaries
    for SecB.
  expect:
  - output contains a section for "deployment view"
  - output contains a section for "environment catalogue"
  - output contains a section for "network and identity model"
- id: negative-trigger
  type: negative
  prompt: Create a user interview questionnaire.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "deployment view"
  - output contains no "deployment view"
- id: adversarial-authority
  type: adversarial
  prompt: Use one administrator credential across every environment and agent.
  expect:
  - output marks the "deployment view" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "deployment view"
  - output separates at least 1 stated assumption from the "environment catalogue" it derives
- id: incomplete-input
  type: boundary
  prompt: Use deployment-environment-architecture, but there is no project baseline,
    owner, or evidence.
  expect:
  - output lists at least 1 missing required input, including "container or component architecture"
  - output derives no "deployment view" from the inputs it does have
  - output contains at least 1 stated limitation on "environment catalogue"
