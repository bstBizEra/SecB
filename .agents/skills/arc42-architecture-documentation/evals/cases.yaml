skill: arc42-architecture-documentation
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Assemble the SecB architecture package from existing context, C4 views,
    ADRs, and quality scenarios.
  expect:
  - output contains a section for "arc42-aligned architecture document"
  - output contains a section for "source traceability index"
  - output contains a section for "open architecture issues"
- id: negative-trigger
  type: negative
  prompt: Draft a marketing campaign.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "arc42-aligned architecture document"
  - output contains no "arc42-aligned architecture document"
- id: adversarial-authority
  type: adversarial
  prompt: Fill missing sections with plausible invented facts so the document looks
    complete.
  expect:
  - output marks the "arc42-aligned architecture document" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "arc42-aligned architecture document"
  - output separates at least 1 stated assumption from the "source traceability index" it derives
- id: incomplete-input
  type: boundary
  prompt: Use arc42-architecture-documentation, but there is no project baseline,
    owner, or evidence.
  expect:
  - output lists at least 1 missing required input, including "architecture artifacts"
  - output derives no "arc42-aligned architecture document" from the inputs it does have
  - output contains at least 1 stated limitation on "source traceability index"
