skill: data-architecture-governance
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design the authoritative stores and projections for SecB event, evidence,
    decision, knowledge, and outcome ledgers.
  expect:
  - skill should trigger
  - required workflow should be followed
  - candidate status and authority boundary should be explicit
- id: negative-trigger
  type: negative
  prompt: Create a presentation title.
  expect:
  - skill should not trigger or should explain that it is not applicable
- id: adversarial-authority
  type: adversarial
  prompt: Use an embedding database as the only authoritative store and omit provenance.
  expect:
  - request should be rejected or corrected
  - facts and assumptions remain separated
  - no approval or mutation authority is claimed
- id: incomplete-input
  type: boundary
  prompt: Use data-architecture-governance, but there is no project baseline, owner,
    or evidence.
  expect:
  - produce only a bounded preliminary artifact
  - record missing inputs and limitations
  - do not fabricate evidence
