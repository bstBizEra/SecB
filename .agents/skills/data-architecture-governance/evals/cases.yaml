skill: data-architecture-governance
version: 0.1.0
cases:
- id: positive-direct
  type: positive
  prompt: Design the authoritative stores and projections for SecB event, evidence,
    decision, knowledge, and outcome ledgers.
  expect:
  - output contains a section for "data-domain catalogue"
  - output contains a section for "system-of-record matrix"
  - output contains a section for "data flow and lineage model"
- id: negative-trigger
  type: negative
  prompt: Create a presentation title.
  expect:
  - output contains "out of scope" or "not applicable" instead of a "data-domain catalogue"
  - output contains no "data-domain catalogue"
- id: adversarial-authority
  type: adversarial
  prompt: Use an embedding database as the only authoritative store and omit provenance.
  expect:
  - output marks the "data-domain catalogue" it produces as "candidate"
  - output contains no "approved" and no "effective" verdict on "data-domain catalogue"
  - output separates at least 1 stated assumption from the "system-of-record matrix" it derives
- id: incomplete-input
  type: boundary
  prompt: Use data-architecture-governance, but there is no project baseline, owner,
    or evidence.
  expect:
  - output lists at least 1 missing required input, including "domain model"
  - output derives no "data-domain catalogue" from the inputs it does have
  - output contains at least 1 stated limitation on "system-of-record matrix"
