blocking_finding:
  id: "GATE2-BLOCKING-001"
  title: "Capacity-exhaustion DoS from an unbounded await in the audit-timeout recovery path"
  discovered_independently_by: ["REV subagent (empirical repro)", "SEC subagent (code-path analysis)"]
  root_cause: >-
    #scheduleAuditTimeout's recovery path performs `await outcome.settled`
    with no timeout wrapper, unlike every other hook/adapter/audit call in
    the file, which is routed through boundedCall's Promise.race pattern.
  consequence: >-
    REV empirically reproduced this: with max_concurrency: 1 and an
    adapter/hook returning a promise that never settles, the first call
    correctly times out and denies, but every subsequent call for the
    process's lifetime returns DENY_CONCURRENCY_LIMIT — the capacity slot
    never drains because #releaseCapacityIfComplete waits on
    reservation.pending, which never empties. With the shipped default
    max_concurrency: 4, four hung hooks permanently wedge the sole
    enforcement chokepoint shut for ALL callers until process restart.
  security_characterization: >-
    Fails closed (denies, does not leak or grant capability), so it is
    not a confidentiality/integrity break — but it is a full availability
    break of the project's single policy-enforcement chokepoint, achievable
    by one uncooperative or buggy hook, with no external attacker needed.
  disagreement_with_coordination_note: >-
    GOV-DEC-OM-MCP-001 addendum 3 characterizes "indefinitely unsettled
    hooks" as design-class, deferring to an outer process/worker
    supervisor. Both independent reviewers disagree with deferring THIS
    specific gap: the fix is bounded, ordinary code using the identical
    boundedCall pattern already applied everywhere else in the file — it
    is not a new architectural boundary, and does not require an ADR.
  required_action: >-
    Apply the same boundedCall/timeout-race pattern to the recovery
    await in #scheduleAuditTimeout, so a hung audit sink cannot
    indefinitely retain a capacity-lane reservation.

residual_assessment:
  - residual: "(a) Durable evidence under an unavailable audit sink"
    verdict: DESIGN_CLASS_ACCEPTABLE_TO_DEFER
    agreement: "REV and SEC both agree"
    reasoning: >-
      The module has a hard, statically-confirmed no-I/O boundary; any
      durable evidence store requires I/O, categorically outside this
      pure in-process file's charter. One narrow, non-blocking asymmetry
      noted by SEC: late-settlement retry is only scheduled for timeouts,
      not for synchronous/rejected audit failures — recommend closing for
      consistency, non-blocking.
  - residual: "(b) Atomic cancellation"
    verdict: PARTIALLY_DESIGN_CLASS_OVERSOLD
    agreement: "REV and SEC both agree, independently"
    reasoning: >-
      Forced preemption of an already-started, uncooperative call is
      genuinely impossible in JS's single-threaded model without external
      process/worker isolation — that half is legitimately design-class.
      But cooperative cancellation was never even attempted: zero
      references to AbortController/AbortSignal anywhere in the file.
      Threading an AbortSignal into adapter.invoke() so COOPERATING
      adapters can voluntarily bail is a standard, low-risk Node pattern
      requiring no ADR. Its total absence is a producer gap, not an
      architectural limit -- recommend tracking as a normal follow-up,
      non-blocking for this gate.
  - residual: "(c) Indefinitely unsettled hooks"
    verdict: SPLIT_VERDICT_SEE_BLOCKING_FINDING
    agreement: "REV and SEC both agree, independently, via different methods"
    reasoning: >-
      The specific fear posed by this residual -- that a hang could cause
      fail-open (request proceeds without narrowing ever applying) -- is
      verified FALSE by both reviewers: every awaited decision-affecting
      hook is timeout-raced to a bounded deny, and the synchronous
      dispatchGuard denies on anything other than a literal false return,
      forecloosing a fail-open-via-hanging-guard attack. But the residual
      as stated obscures a real, different, producer-fixable defect (see
      blocking_finding above) rather than being purely architectural.

