valid_until: "2026-11-03T00:00:00Z"

authority_note: >-
  The guards say what they are for: any UNAUTHORIZED drift of a pinned file must
  fail. The merge produces authorized drift in five files, and the only thing
  separating the two is a decision recorded somewhere a reader can find it.

  The producer left all sixteen failing rather than re-pinning them, for the same
  reason WP-GOV-VF1's first commit did: re-pinning would have made the branch
  look mergeable while removing the only signal that it was not. GOV
  authorization of this package is what converts that drift from unauthorized to
  authorized. Without it there is nothing here to land.
