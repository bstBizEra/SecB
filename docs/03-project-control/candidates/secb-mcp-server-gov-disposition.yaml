  - id: "GOV-MCP-02"
    adopted: "Hand-rolled pinned JSON-RPC subset for alpha (zero new deps, deny-by-default methods, unpinned-version refusal); SDK adoption re-asked at the mutation phase, never inherited silently"
  - id: "GOV-MCP-03"
    adopted: "The exact eight-tool READ-ONLY alpha allowlist ratified as enumerated, including exclusion of AuthorityEngine evaluation and report file generation; additions require re-registration + Immune re-review"
  - id: "GOV-MCP-04"
    adopted: "Caller-identity honesty position accepted: asserted instance id resolved against a seeded registry (APPROVED+ACTIVE); enforcement boundary acknowledged as the OS process spawn (SARCHI-AA-01); mutation tools blocked until a session/credential substrate exists"
  - id: "GOV-MCP-05"
    adopted: "Effective ceiling = min(server config, caller max_data_classification), default INTERNAL, exact-match lattice, unknown -> RESTRICTED withheld; above-INTERNAL server ceiling requires an explicit CLI argument; one shared lattice implementation (src/ui/report-projections.mjs)"
  - id: "GOV-MCP-06"
    adopted: "Invocation ledgering fail-closed: DENY_AUDIT_UNAVAILABLE (withhold results when the invocation record cannot append), dedicated ledger file, one bounded retry"
  - id: "GOV-MCP-07"
    adopted: "New numbered stream (proposed P0-21 'SecB MCP Server' to avoid collision with P0-19/P0-20; operator to confirm the id), sequenced BEHIND the P0-09 merge and P0-10 R2; baseline on post-merge main"
