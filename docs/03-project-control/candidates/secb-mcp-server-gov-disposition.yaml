    adopted: "Server self-registration: the server ships and validates its own registration record (methods=catalog fingerprint, classification, evaluation, lifecycle) and refuses to serve unless it resolves APPROVED+ACTIVE"
  - id: "GOV-MCP-09"
    adopted: "Protocol version pinning: refuse non-pinned initialize outright with a typed error; version bumps are deliberate reviewed catalog releases"

