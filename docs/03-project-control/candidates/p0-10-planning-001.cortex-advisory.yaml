blocking_decisions_for_human_gov:
  - id: "GOV-P010-01"
    question: "Approve service boundary option C (dedicated ContextFederationService composing over injected WorkPackageContractService.resolveEffective, necessary-but-not-sufficient, either denial denies), or mandate A or B?"
    recommendation: "Approve option C; it is the only option with a single live definition of effectiveness and no stale-snapshot smuggling channel, and it structurally mirrors the already-adopted GOV-P009-01 pattern"
  - id: "GOV-P010-02"
    question: "contracts/context-receipt.schema.json omits fields SECB-OM-CONTEXT-001 requires (issuer, issue time, expiry, revocation status) plus work-package version and chain-parent linkage, and is closed to extension. Enforce these ledger-side for R2 with a schema v2 as a gated follow-up, or bump the schema before R2?"
    recommendation: "Ledger-side for R2 (keeps the shared contract surface frozen and V-004 unblockable now); schema v2 tracked as an extend-only V-item so the sealed document eventually carries its own expiry and chain fields"
  - id: "GOV-P010-03"
    question: "Compaction model: chain-and-supersede (new version, parent hash recorded, parent deny-on-use) versus re-seal in place?"
    recommendation: "Chain-and-supersede; prohibit re-seal categorically - an in-place re-seal is indistinguishable from tampering and destroys the audit property that every hash a session ever consumed remains resolvable"
  - id: "GOV-P010-04"
    question: "Session binding: is a receipt bound to exactly one session_id at issuance (multiple validations within that session allowed, re-binding prohibited, new session requires new issuance), or may receipts be re-bound or shared across sessions?"
    recommendation: "Single-session binding as stated; sharing/re-binding is the primary context-smuggling channel and re-issuance is cheap"
  - id: "GOV-P010-05"
    question: "Freshness: confirm expires_at = min(issued_at + policy TTL, work package valid_until), deny-on-use with no timer mutation, and consumption-time live re-resolution; and set the default TTL"
    recommendation: "Confirm the clamp and deny-on-use; for R2 default TTL = work package valid_until (no shorter window) to avoid a second expiry policy before there is operational data; allow issuers to request shorter, never longer"
  - id: "GOV-P010-06"
    question: "Issuance authority: which actors may issue receipts - the session's own actor under its existing grant (role must match assigned_role), a dedicated issuer role, or GOV only?"
    recommendation: "R2: any actor holding an ACTIVE grant binding actor+project+work_package whose role matches the receipt's assigned_role, gated service-side without touching AuthorityEngine; a dedicated CTX_ISSUER role is deferred until P0-11 defines cross-agent handoff actors"
  - id: "GOV-P010-07"
    question: "Supersession cascade: when a newer work package version becomes effective (GOV-P009-05) or the work package is revoked, are outstanding receipts explicitly revoked in the ledger, or invalidated purely by consumption-time resolution?"
    recommendation: "Deny-on-use via consumption-time resolution only - no cascade writer, consistent with GOV-P009-03; the ledger records the denial at the moment of attempted use, which is the audit-relevant event"

non_blocking_risks:
  - id: "RISK-P010-01"
    statement: "Retrieval stages 6-7 (relevance ranking, minimum-sufficiency) are inherently heuristic; only their subtractive property is mechanically enforceable, so a poor ranking can starve a session of needed context without violating any gate"
    mitigation: "Enforce and test the subtractive guarantee (stages 6-7 never add/widen); treat ranking quality as observability, not authority - exclusions recorded per stage make starvation diagnosable"
  - id: "RISK-P010-02"
    statement: "P0-09 is implemented but not yet accepted; resolveEffective semantics could shift during its review, invalidating P0-10's composition assumptions"
    mitigation: "Bind this packet to baseline 04b7105c; re-review the composition contract on any P0-09 change; the fail-closed composition test catches semantic drift at conformance time"
  - id: "RISK-P010-03"
    statement: "Canonicalization drift: the federation service's canonical fingerprint must eventually agree with P0-13 evidence sealing, or the same content will carry two 'canonical' hashes"
    mitigation: "Extract the P0-09 canonicalize/fingerprint pair into a single shared module at P0-10 R2 (additive extraction, no behavior change) and require P0-13 to consume it"
  - id: "RISK-P010-04"
    statement: "tests/fixtures/valid/context-receipt.json carries a placeholder content_hash that passes the schema pattern; any test that equates schema validity with seal validity inherits a blind spot"
    mitigation: "Regenerate the fixture hash from the frozen canonicalization spec; add an explicit negative test asserting that this schema-valid-but-seal-invalid shape is denied at issuance"
  - id: "RISK-P010-05"
    statement: "Chain length and ledger growth under aggressive compaction increase replay and audit cost"
    mitigation: "Derived-status snapshot keyed by ledger fingerprint as an optimization only, never authoritative (RISK-P009-03 parity)"
  - id: "RISK-P010-06"
    statement: "No session service exists yet; session_id binding is validated against a caller-asserted identity until the Session state machine gains a service, weakening (not voiding) the session-replay gate"
    mitigation: "Record the asserted session_id in every ledger entry so retroactive audit is possible; upgrade to service-verified session identity when the session runtime lands (tracked V-item)"

