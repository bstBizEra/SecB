architecture_options:
  - option: "A. Extend WorkPackageContractService with receipt issuance - fold Context Receipt operations into the existing P0-09 service"
    benefits:
      - "One authoritative store; receipt binding to the effective work package is an in-process lookup with no composition seam"
      - "Reuses the accepted hardening (idempotency map, ledger, freeze) with zero duplication"
    risks:
      - "Mutates an implemented-and-under-review P0-09 surface before its own acceptance; every P0-10 defect becomes a P0-09 regression"
      - "Couples two lifecycles (authorization contract vs. context receipt) in one ledger, making SoD and audit queries ambiguous about which authority produced which entry"
      - "Violates the P0-09 explicit_non_scope ('no modification of accepted service surfaces' pattern) and forces re-review of already-disposed GOV-P009 decisions"
  - option: "B. Standalone ContextFederationService with its own copy of grants, work-package snapshots, and its own effectiveness logic"
    benefits:
      - "Fully isolated blast radius; P0-10 defects cannot touch P0-09 code paths"
      - "No runtime dependency ordering; the service can be built and tested before P0-09 integration lands"
    risks:
      - "Duplicates resolveEffective; two divergent definitions of 'effective work package' is precisely the class of drift RISK-P009-01 polices, now across services instead of layers"
      - "Snapshot-based effectiveness cannot see supersession, expiry, or revocation that occurs after snapshot - a stale-context smuggling channel by construction"
  - option: "C. Dedicated ContextFederationService as the sole authoritative boundary for Context Receipts, composing over an injected WorkPackageContractService instance: every issuance and every consumption calls resolveEffective live and treats its ALLOW as necessary but not sufficient; the federation service then applies its own hardened receipt checks (schema, seal, binding, freshness, session, SoD) and either layer's denial denies"
    benefits:
      - "Single definition of effectiveness (P0-09's resolveEffective) with no duplication and no snapshot staleness; supersession/expiry/revocation are enforced at use time automatically"
      - "Direct structural mirror of the accepted GOV-P009-01 option-C pattern: domain-specific authority lives in the dedicated service, the composed dependency answers only its own question"
      - "Fail-closed by construction: resolveEffective NONE, seal mismatch, binding mismatch, expiry, or unknown state each independently deny"
      - "Shared surfaces (contract-validator, AuthorityEngine, state-machine, work-package-service) are consumed, never modified"
    risks:
      - "Consumption-time re-resolution adds a call per use; a caller-visible rule is needed for which typed denial wins when both layers deny (federation service's typed code wins, carrying the underlying reason)"
      - "Requires P0-09 to be stable enough to inject; P0-09 acceptance is a sequencing gate for P0-10 R2 (not for this planning)"

recommended_option: "C"

service_contract:
  authoritative_record: "Immutable, versioned Context Receipt record keyed by (project_id, receipt_id, version); the stored record wraps (a) the schema-valid receipt document per contracts/context-receipt.schema.json and (b) server-side issuance metadata the closed schema cannot carry - issuer actor, bound work package version, issued_at, expires_at, status, parent receipt fingerprint (ledger-side per GOV-P010-02); content_hash is computed server-side as canonical SHA-256 over the receipt document with the content_hash field excluded; a caller-supplied content_hash that does not match the recomputation is denied, never silently corrected; records are deep-cloned on read and frozen; an append-only receipt ledger (ISSUE, CONSUME, COMPACT_CHAIN, REVOKE entries) is the source of truth - current receipt status is derived by replaying the ledger, never from a mutable field"
  public_operations:
    - "issueReceipt(request, { idempotencyKey }) - closed request shape (unknown keys deny); resolves the effective work package via the injected P0-09 resolveEffective(project_id, work_package_id, { baseline: baseline_version }) and denies on anything but ALLOW; derives authority_scope/allowed_tools/allowed_skills server-side as the intersection of the effective contract and the issuer grant (caller may narrow, never widen); validates the assembled document with validateContract('contextReceipt', ...); seals with server-computed content_hash; server timestamps; string-only idempotency"
    - "consumeReceipt(project_id, receipt_id, { session_id, actor_id, baseline }) - the single gate a session uses to admit context; re-verifies seal, bindings, freshness, and live effectiveness (see retrieval_resolution); returns the frozen receipt document on ALLOW, typed NONE otherwise; every consumption is a ledger entry"
    - "compactReceipt(project_id, receipt_id, compaction, { idempotencyKey }) - issues version N+1 of the same receipt_id as a chained successor (subset-only, see invariants); parent version becomes SUPERSEDED deny-on-use; never re-seals in place"
    - "revokeReceipt(project_id, receipt_id, envelope) - GOV-gated; terminal for all versions of the receipt chain"
    - "getReceipt(project_id, receipt_id, version?) - deep-cloned frozen read of a specific or chain-head version, including derived status; read does not imply usability"
    - "getReceiptLedger(project_id, receipt_id) - append-only audit read"
  retrieval_resolution:
    - "Issuance-time retrieval policy is the SECB-OM-CONTEXT-001 seven-stage order implemented as an ordered, subtractive, fail-closed pipeline: (1) project scope - only sources bound to project_id; (2) authority filter - sources exceeding the actor's derived authority/classification are removed; (3) temporal/current-state filter - superseded or stale-beyond-cutoff sources removed; (4) verification status - unverified sources removed or explicitly marked, never silently included as verified; (5) exact source evidence - every surviving item must carry a resolvable source_reference, unresolvable items removed and recorded; (6) relevance ranking - reorders only; (7) minimum-sufficient compaction - removes only; stages 6-7 can never add, widen, or upgrade an item excluded by stages 1-5"
    - "Every stage records what it excluded; the receipt's exclusions/redactions ledger metadata is the audit trail that compaction was subtractive"
    - "Consumption resolves fail-closed, all checks server-side: receipt exists and ledger-derived status is ISSUED (not SUPERSEDED, REVOKED, or EXPIRED); recomputed content_hash equals the sealed and ledger-recorded hash; server time is before expires_at; the injected resolveEffective(project_id, work_package_id, { baseline }) returns ALLOW and its resolved version equals the ledger-bound work package version; asserted baseline equals the receipt's baseline_version equals the effective contract baseline; session_id equals the receipt's bound session_id; actor_id holds a currently valid grant consistent with assigned_role; any validation error, unknown state, ledger gap, or fingerprint mismatch resolves to NONE with a typed reason - no partial context, no fallback to an older receipt version"
    - "Expiry and revocation are deny-on-use at issuance and consumption time against the server clock (GOV-P009-03 parity); no timer-driven mutation, no background writers"

receipt_authority_invariants:
  - "No receipt may be issued unless resolveEffective returns ALLOW for (project_id, work_package_id, baseline_version) at issuance time; NONE for any reason (no authorized version, expired, baseline mismatch, unbound baseline) denies issuance with the underlying typed reason"
  - "authority_scope, allowed_tools, and allowed_skills are server-derived intersections; a request enumerating anything outside the effective contract or issuer grant is denied (DENY_SCOPE_WIDENING), not clamped - clamping would hide caller misbehavior from audit"
  - "Issuance requires an ACTIVE grant binding actor+project+work_package within its validity window, checked service-side in the WORK_PACKAGE_SERVICE_ROLE_GATES style without modifying the shared AuthorityEngine (issuer role model per GOV-P010-06)"
  - "A receipt binds exactly one session_id at issuance; consumption by any other session denies (DENY_SESSION_MISMATCH); serving a second session requires a new issuance, never re-binding"
  - "All authoritative timestamps (issued_at, expires_at, ledger timestamps) are server-derived; the schema's freshness_timestamp and any caller-supplied times are retained as claimed metadata only and never used for expiry or authority evaluation"
  - "expires_at = min(issued_at + policy TTL, work package valid_until); a receipt can never outlive the authorization it federates (GOV-P010-05)"
  - "receipt_id, project_id, work_package_id, session_id must not contain '|' (composite-key delimiter, P0-09 Immune finding parity); denial code DENY_ID_CHARSET"
  - "Idempotency: string-only non-blank keys; same key + same canonical request fingerprint replays the original result marked replayed; same key + different fingerprint is a conflict denial; keys are namespaced per operation via the fingerprinted op tag"
  - "All returned objects are deep-cloned and frozen; mutation of a returned receipt never affects stored state"

compaction_and_freshness_invariants:
  - "Compaction is chain-and-supersede, never re-seal: version N+1 carries its own server-computed content_hash; the ledger COMPACT_CHAIN entry records the parent's content_hash, cryptographically linking the chain; the parent document is retained immutable in the ledger forever"
  - "Subset-only rule: the successor's source_references must be a subset of the parent's, and its allowed_tools/allowed_skills/authority_scope must be subsets of the parent's; every removed reference must appear in the recorded exclusions; any new reference, tool, skill, or scope entry in a compaction request denies (DENY_COMPACTION_ADDITIVE)"
  - "A superseded parent is deny-on-use with a typed pointer to the chain head; a consumer holding a stale version is redirected, never silently upgraded - the session must consume the chain head explicitly so the ledger shows which sealed content it actually received"
  - "Receipts referencing compacted-away content remain auditable: the chain preserves every parent document, so historical claims resolve through the ledger; runtime consumption of compacted-away content is impossible because only the chain head is consumable"
  - "Compaction never extends freshness: successor expires_at <= parent expires_at, and the successor re-passes the live resolveEffective gate at compaction time - compaction of a receipt whose work package has expired or been superseded denies"
  - "REVOKE is terminal for the entire chain (all versions); recovery is a fresh issuance against the then-effective work package"

adversarial_smuggling_matrix:
  - attack: "Forged seal: caller submits tampered content with a self-computed or copied content_hash (the valid fixture's placeholder 'aaaa...' hash is schema-valid, proving schema validation alone cannot detect this)"
    gate: "Server recomputes the canonical hash at issuance and at every consumption; mismatch denies (DENY_FINGERPRINT_MISMATCH); seal verification is independent of, and after, schema validation"
  - attack: "Foreign context: a receipt issued for project X or work package Y presented to a session running under a different project/work package"
    gate: "Consumption re-checks the full binding tuple (project_id, work_package_id, bound WP version, baseline, session_id) against live resolveEffective; any mismatch denies"
  - attack: "Stale context: receipt consumed after the work package expired, was revoked, or was superseded by a newer authorized version (GOV-P009-05 implicit supersession changes the effective version out from under old receipts)"
    gate: "Consumption-time resolveEffective is live, and the resolved version must equal the ledger-bound version; expiry/revocation/supersession all yield typed NONE (deny-on-use, no timers)"
  - attack: "Backdating: caller supplies freshness_timestamp or claimed times to slide around expiry windows"
    gate: "All authority evaluation uses server clock and server-recorded issued_at/expires_at; caller times are claimed metadata only"
  - attack: "Session replay: a receipt legitimately issued to session A injected into session B"
    gate: "Single-session binding at issuance; DENY_SESSION_MISMATCH; consumption ledger entries make cross-session presentation attempts visible to Immune review"
  - attack: "Compaction smuggling: 'compacting' a receipt while inserting new sources, tools, or widened scope into the successor"
    gate: "Subset-only rule with explicit exclusions accounting; additive delta denies; successor re-passes the effectiveness gate"
  - attack: "Re-seal laundering: mutate content, recompute a fresh valid hash, and overwrite the stored receipt"
    gate: "Append-only ledger with hash chaining; there is no update operation - only chained versions; the ledger-recorded parent hash makes silent replacement detectable and the derived status makes the parent unusable rather than editable"
  - attack: "Authority widening at issuance: requesting allowed_tools/authority_scope beyond the effective work package contract (e.g., adding a network or MCP method the contract never granted)"
    gate: "Server-side derivation, intersection-only, DENY_SCOPE_WIDENING on any excess; the caller never supplies authoritative scope"
  - attack: "Bypassing resolution: caller supplies its own copy of a work package contract to 'prove' effectiveness"
    gate: "issueReceipt accepts only identifiers plus asserted baseline; the service resolves internally against the injected P0-09 service; caller-supplied contract bodies are unknown keys and deny"
  - attack: "Baseline drift: session executes against a different commit than the receipt/work package baseline (V-016 drift case)"
    gate: "Triple equality required at consumption: asserted baseline == receipt baseline_version == effective contract baseline; exact-commit semantics per GOV-P009-06, no descendant allowance"
  - attack: "Identity collision: '|' embedded in receipt/session ids to collide composite keys and cross-authorize"
    gate: "Charset denial on all id fields, matching the P0-09 Immune finding fix"
  - attack: "Replay divergence: reusing an idempotency key with altered payload to overwrite a recorded issuance"
    gate: "Canonical fingerprint comparison; conflict denial; replays return the original frozen result"
  - attack: "Read-path mutation: mutating a returned receipt object to alter what the session believes was authorized"
    gate: "Deep clone + deep freeze on every read and result; stored state provably unaffected (negative test)"

negative_test_matrix:
  - "Issue with missing/extra/blank request field, non-string scalar, or '|' in any id -> typed denial"
  - "Issue for a work package with no AUTHORIZED-or-later version, an expired version, or a mismatched baseline -> denial carrying the resolveEffective typed reason"
  - "Issue requesting any tool/skill/scope beyond the effective contract intersection -> DENY_SCOPE_WIDENING"
  - "Issue with a caller content_hash differing from server recomputation -> DENY_FINGERPRINT_MISMATCH; document failing contextReceipt schema -> DENY_CONTRACT_INVALID"
  - "Issue with non-string idempotency key -> denial; same key different request -> conflict; same key same request -> stable replay flagged replayed"
  - "Consume with wrong session_id, wrong actor, lapsed grant, or unknown receipt -> typed NONE"
  - "Consume after server clock passes expires_at, or after work package valid_until, whichever is earlier -> DENY_EXPIRED"
  - "Consume after a newer work package version reaches AUTHORIZED (supersession) -> typed NONE (bound version no longer effective)"
  - "Consume a SUPERSEDED parent after compaction -> typed NONE with chain-head pointer; consume after chain REVOKE -> typed NONE"
  - "Consume a receipt whose stored document was tampered (hash recompute fails) -> DENY_FINGERPRINT_MISMATCH"
  - "Compact with any additive source/tool/scope delta, or with exclusions not accounting for removals -> DENY_COMPACTION_ADDITIVE"
  - "Compact extending expires_at beyond parent or beyond valid_until -> denial; compact when work package no longer effective -> denial"
  - "Revoke by non-GOV actor -> denial; any operation on a revoked chain -> typed NONE"
  - "Mutation attempt on any returned receipt/ledger object does not affect stored state (clone/freeze verified)"
  - "Fail-closed composition: a hypothetical resolveEffective ALLOW paired with a federation-layer denial (e.g., session mismatch) still denies; and a federation-layer pass never overrides resolveEffective NONE"

