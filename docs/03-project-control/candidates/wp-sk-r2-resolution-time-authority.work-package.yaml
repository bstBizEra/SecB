acceptance_criteria:
  - id: "AC-R2-01"
    statement: "resolveSkill consults the decision lookup for every claimed HUMAN_PROMOTION on every call, not once at registration."
    proof: "A lookup that counts invocations shows one call per resolveSkill per promotion entry. Verified to fail when the call is removed."
  - id: "AC-R2-02"
    statement: "A decision past valid_until denies at the next resolveSkill in the same process, with no restart."
    proof: "Probe: register inside the window (ALLOW), resolve at an instant past valid_until (DENY). Both arms asserted, so the test cannot pass by always denying."
  - id: "AC-R2-03"
    statement: "A REVERTED decision denies at the next resolveSkill in the same process, with no restart."
    proof: "Probe: ALLOW, append REVERSION, DENY. Both arms asserted."
  - id: "AC-R2-04"
    statement: "A deny under AC-R2-02 or AC-R2-03 carries a typed code distinct from DENY_UNKNOWN_SKILL, and the code is in the hub's DENY_CODES allow-list so the withheld tally cannot bucket it as DENY_UNRESOLVED."
    proof: "Assertion on the returned code plus the hub's allow-list."
  - id: "AC-R2-05"
    statement: "Every evidence_refs entry is resolved through an injected evidence lookup; an entry that does not resolve denies at registration."
    proof: "Probe: a real reference registers, evidence_refs ['lol'] is refused. Both arms asserted."
  - id: "AC-R2-06"
    statement: "The evidence lookup is REQUIRED, like decisionLookup. A resolver constructed without one throws at construction rather than silently skipping the check."
    proof: "Constructor test. This is the DEF-M1 lesson: an optional check is an absent check."
  - id: "AC-R2-07"
    statement: "The registry remains empty and no production wiring binds a real ledger. AC-10's walk still passes unchanged."
    proof: "Existing test, unmodified."
  - id: "AC-R2-08"
    statement: "Every control added is demonstrated to fail when removed."
    proof: "Sabotage matrix: remove each control, confirm suite exit 1, restore, confirm exit 0. Run by the producer and independently by QA."
  - id: "AC-R2-09"
    statement: "npm run validate exits 0 and the suite exits 0, judged by EXIT CODE."
    proof: "Producer-run, recorded as evidence not acceptance. A grep for a FAIL status is not evidence - validate-foundation.mjs throws and never emits one (DEF-M1)."

test_plan:
  - "Positive: a live, in-window, unreverted decision continues to resolve ALLOW. Without this the suite could pass by denying everything."
  - "Negative: expired; reverted; evidence reference unresolvable; evidence reference resolving but not accepted."
  - "Regression: the full existing SkillsHub and conformance suites, including V-013 in tests/conformance-stubs.test.mjs, which drives the whole chain and will exercise the new path."
  - "Sabotage: per AC-R2-08, every control."

review_plan:
  - "REV: confirm the resolution-time check cannot be bypassed by any path that reaches resolveSkill, and that the frozen registered manifest is not itself trusted for the temporal facts."
  - "SEC: this changes a fail-closed authorization path. Confirm no failure mode of the lookup produces an ALLOW - a throwing, hanging, or malformed lookup must deny."
  - "QA: re-run the sabotage matrix independently."

security_plan:
  - "The central risk is a new denial-of-service surface: if the lookup is slow or throws, every resolution fails. That is the correct direction, but it must be deliberate and tested."
  - "The second risk is a trusted-instant problem: resolution must derive its instant per call, not capture one at construction. A captured instant makes expiry permanently stale, which is the defect this work package exists to close, re-created."
  - "Secret scan over changed files before handoff."

evidence_destination: "SecB Evidence Ledger - accepted by the Evidence authority, not by the producer"

human_approval_requirements:
  - "GOV authorization to begin: NOT GRANTED."
  - "GOV approval to merge: NOT GRANTED."
  - "No SEC registry-gate clearance is required, because nothing is populated. If anyone asserts otherwise mid-execution, that is a signal the scope has drifted."

schedule:
  execution_window_opens: "On GOV authorization"
  expiry: "Authorization lapses if not started within 30 days."
budget: "Small by construction. Growth is evidence the scope drifted."

checkpoint_rules:
  - "Checkpoint after AC-R2-01 through AC-R2-04 and before touching evidence verification - the two halves are independently useful and independently revertible."
  - "STOP if closing any criterion requires a contract change, a wiring change, or populating the registry. All three are prohibited, and needing one means this work package was mis-scoped."
rollback_plan: >-
  A git revert, complete. No ledger entry, no registry state, no contract
  version, and no persisted artifact is created by this work package, so nothing
  survives the revert. This rollback plan was checked against the code rather
  than asserted - the previous work package claimed a revocation mechanism that
  the schema forbids and the code does not implement.
recovery_rules:
  - "No persisted state exists outside git; resume from the last checkpoint."
integration_rules:
  - "Rebase onto the branch tip before handoff. Conflicts in src/mcp or tools indicate a scope breach."
activation_rules:
  - "None. Nothing is activated. MOD-SKILL remains QUEUED - partial."

learning_obligations:
