work_package_id: "WP-SK-R2"
project_id: "prj_secb_local"
product_id: "SECB-PRD-SKILLSHUB-001"
module_id: "MOD-SKILL"
goal_id: "GATE-SK-05"
title: "Make the governed decision continuously authoritative at resolution"

objective: >-
  Consult the DecisionLedger at resolution, not only at registration, so that an
  expired or reverted promotion stops authorizing, and so that evidence
  references are verified rather than counted.

problem_statement: >-
  DEF-R2: `decisionLookup` is called only in `registerSkill`. `resolveSkill`
  reads a deep-frozen clone captured at registration and never revisits the
  ledger. Probe: resolution after `valid_until`, and after the decision is
  REVERTED, both return ALLOW. There is no unregister API. A grant, once made,
  can never expire and can never be revoked.

  `docs/00-governance/governance-baseline.md` section 3 requires denial when an
  approval "is expired, revoked, replayed, or for a different object". Three of
  those four are unenforceable today. This is a live violation of the pinned
  baseline, present in shipped code, not a planning gap.

  DEF-R3: `evidence_refs` is checked for `length > 0` and nothing else. It is
  never resolved against the EvidenceLedger. `evidence_refs: ["lol"]` registers.

desired_outcome: >-
  An expired decision, a reverted decision, and an unresolvable evidence
  reference each deny at the next resolution, in the same process, with no
  restart - proven by probe, and by removing each control and observing failure.

non_goals:
  - "Publishing any skill. The registry stays empty and no promotion is minted. This work package does not approach the DEF-A8 gate."
  - "DEF-R1, the bearer-token defect. A decision cannot name the skill it authorizes because contracts/decision-record.schema.json is closed. That is a contract change and belongs to ARCHI, not here."
  - "Building an evaluation runner. Per register section M the corpus cannot yield evidence as written, and OD-SK-04 is open."
  - "The contract tier split, AC-05, AC-08, or any resolver migration onto the descriptor/grant pair."
  - "Editing .agents/ - PACK.yaml declares mutation_authorized: false. Editing src/mcp/ - concurrent work by another producer."
  - "Editing contracts/** - this work is deliberately achievable without any contract change."

why_this_is_outside_the_registry_gate: >-
  SECB-SEC-DECISION-SKILLSHUB-C3-001 blocks POPULATING the resolver registry.
  This work package populates nothing, publishes nothing, and mints no decision;
  it changes when an already-registered grant is re-checked. It therefore does
  not require the gate to be lifted, amended, or waived, and it must not be used
  as an occasion to do so.

why_this_dissolves_the_deadlock: >-
  DEF-G1: the signed registry gate blocks population until Phase 5 distribution
  hardening completes. Phase 5 is WP-SK-06, whose named legs include
  resolution-time revocation - and WP-SK-06 depends on WP-SK-05, whose exit is
  one skill reaching PUBLISHED, which is population. The gate forbids the act
  whose completion is its own release condition.

  This work package delivers WP-SK-06's revocation leg WITHOUT populating
  anything, which is the only move available that advances the release condition
  from outside the gate. It does not by itself discharge the gate; it removes the
  circularity so that SEC and GOV have something other than a paradox to rule on.

risk_class: "R3"
mutation_class: "M2"
mutation_rationale: >-
  M2, isolated non-production mutation. No ledger is written, no registry is
  populated, no authority is issued, no contract changes. The change is to a
  fail-closed authorization path, which is why the class is R3 even though the
  mutation is M2. GOV should set both rather than accept the producer's proposal.

