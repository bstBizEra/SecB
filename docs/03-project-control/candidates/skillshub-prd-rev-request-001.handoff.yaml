  corrections_after_dispatch:
    - id: "SKILL-DRIFT-14"
      correction: "WITHDRAWN. This packet dispatched it as the highest-severity unresolved finding. It was not true at the pin. secb_skill_resolve did accept a fully caller-supplied scope context at e0de4f3, but the MCP producer closed it in 42c2190 at 01:15:31 - 56 minutes before the reviewed PRD was committed at 02:11:24 and 58 before this packet at 02:13:47. The producer observed the defect at an earlier HEAD and published it without re-verifying."
      landed_fix: "42c2190 removed context from the tool arguments in favour of a required project_id, derives runtime from callerIdentity.runtime_product_id and classification from the server ceiling, and adds a pre-dispatch DENY_CALLER_PROJECT_SCOPE check verifying args.project_id against the caller identity's own project_scopes for BOTH skill tools. Covered by tests/mcp-server.test.mjs. This is stronger than the fix this document would have proposed."
      recorded_as: "SKILL-FIX-07 in SECB-PRD-SKILLSHUB-001 v0.3.0-draft"
      status: "closed by another producer, independently of this work"
      review_implication: "The root cause is the same failure mode that produced three false absence claims in PRD v0.1.0: asserting a state without re-deriving it against a moving HEAD. REV should treat every remaining state claim in the reviewed document as suspect until independently re-derived."
  unresolved_findings:
    - id: "SKILL-DRIFT-15"
      severity: "high"
      finding: "The four .agents/install scripts copy every package into a harness skills directory with no identity, scope, classification, promotion or revocation check. This is the operative distribution path today and it bypasses the SkillsHub entirely."
      owner: "ARCHI + GOV (OD-SK-12)"
      status: "open"
    - id: "OD-SK-11"
      severity: "requires SEC verdict before the requirement is entrenched"
      finding: "The withheld-count disclosure design is unreviewed. e7d14ee closed the enumeration channel, but a query-invariant tally still discloses corpus size, and the per-code breakdown still discloses cross-project existence, above-ceiling existence, incident volume, and candidate pipeline volume. FR-SKD-003 elevates this producer-authored design to a MUST."
      owner: "SEC"
      status: "open"
    - id: "RATIONALIZATION-CORPUS-GAP"
      severity: "medium"
      finding: "Publication gate 7 requires adversarial AND rationalization tests. All 22 evaluation suites declare exactly four case types and none is rationalization. This is a corpus gap as well as a runner gap: no existing suite can satisfy the gate."
      owner: "SKILL + QA"
      status: "open"
    - id: "PRD-7.4-SELF-ASSERTION"
      severity: "medium"
