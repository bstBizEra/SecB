authority_note: >-
  This is the request the guards themselves describe. main pins the validator's
  blob in seven test files so that, in their own words, "any UNAUTHORIZED further
  drift of the validator still fails this guard", and records the legitimate
  route in each: the file "was authorized-modified by MOD-WSPACE-S3", then "again
  by MOD-MEM S2".

  The producer declined to update those pins on the prepared branch. Re-pinning
  tamper detection to an artifact the producer wrote, without authorization, is
  precisely the move the guard exists to prevent — and doing it would have made
  the branch look mergeable while removing the only signal that it was not. The
  seven failures are left standing so the requirement is visible.

  GOV authorization of this work package is what converts that drift from
  unauthorized to authorized. Without it there is nothing here to merge.
