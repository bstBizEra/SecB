work_package_id: "WP-GOV-VF1"
version: 1
project_id: "prj_secb_local"
module_id: "MOD-GOV"
title: "Authorized modification: exact-set contract pins in the foundation validator"

objective: >-
  Make `tools/validate-foundation.mjs` capable of failing when a governed
  contract gains, loses, or promotes a field, and update the seven byte-identity
  guards that pin the validator's blob, as an authorized modification in the
  idiom those guards already record.

problem_statement: >-
  DEF-M2. `npm run validate` cannot see a contract property change. Verified on
  main at e8eb4ec by mutation, exit codes observed rather than inferred: adding
  an optional property to contracts/decision-record.schema.json left validate at
  exit 0, and pushing that property into the schema's `required` array ALSO left
  it at exit 0. Only the per-contract unit test caught either.

  The pin at `mandatoryIdentityFields` is a required-field SUBSET test, satisfied
  by any superset, with no property-set and no count assertion. Anyone changing a
  governed contract and running `validate` alone gets a green light
  unconditionally. Twenty governed contracts are exposed.

  This is DEF-M1's standing rule turned on the validator: a check that cannot
  fail is not evidence. The programme that adopted that rule then leaned on this
  validator for six review rounds.

risk_class: "R2"
mutation_class: "M2"
status: "AUTHORIZED"

baseline:
  target_branch: "main"
  baseline_commit: "e8eb4ec"
  prepared_branch: "fix/validate-foundation-exact-pins"
  prepared_commit: "8f7a91e"
  note: >-
    The prepared commit deliberately FAILS main's byte-identity guards and is not
    mergeable as-is. That is the point of this request.

scope:
  - "tools/validate-foundation.mjs — add exact-set pins on both the required set and the property-name set of all 20 governed contracts, plus two coverage assertions holding each map's key set equal to the schema allowlist."
  - "Retain the existing subset pin unchanged. It names the identity fields a contract may never lose, which is a narrower and more legible claim than the exact sets. Coverage grows; nothing is replaced."
  - "Update the validator blob pin in the SEVEN test files that carry it: tests/cadence-policy, event-family-policy, kpi-registry, overlap-policy, replay-assembler, scorecard-assembler, write-set-policy. Each currently asserts dbd4d10883e7724aa75301fc7f3b5c9528089726."
  - "Record the modification in each guard's comment in the existing idiom — the guards already read 'authorized-modified by MOD-WSPACE-S3', then 'again by MOD-MEM S2'. This becomes the third such entry and must name this work package."

non_scope:
  - "No contract schema is added, removed, or edited. The file SET and every schema's content are unchanged; only the validator's assertions about them change."
  - "No other pinned file is touched. The guards protecting DOC_REL, src/control/risk-registry.mjs, tests/risk-registry.test.mjs and package.json must continue to pass unmodified."
  - "No src/ change. No runtime behaviour change of any kind. The validator is a build-time check."
  - "DEF-M3 is NOT in scope. src/control/risk-registry.mjs:36 asserts that doc-parity drift 'fails CI' when no CI exists in this repository — no .github/, no .gitlab-ci.yml, no azure-pipelines.yml, no Jenkinsfile. That file is blob-pinned by the same guards and correcting its comment would require this work package to modify a second guarded file for an unrelated reason. Raised so it is not lost; it needs its own disposition."

acceptance_criteria:
  - id: "AC-VF1-01"
    statement: "`npm run validate` exits 1 when an optional property is added to any governed contract, and exits 1 when an existing optional property is promoted to required."
    verification: "Mutate contracts/decision-record.schema.json both ways; observe exit 1 each time; restore; observe exit 0. Claimed by exit code, never by grepping output for a status string."
  - id: "AC-VF1-02"
    statement: "`npm run validate` exits 1 when a required field is removed from any governed contract, including a field the subset pin does not name."
    verification: "Remove bound_action from contracts/skill-promotion.schema.json and, separately, integrity from contracts/skill-candidate.schema.json. Neither appears in mandatoryIdentityFields, so neither is caught today. Observe exit 1 each time; restore; observe exit 0."
  - id: "AC-VF1-03"
    statement: "A contract admitted to the schema allowlist without a pin entry fails the coverage assertion."
    verification: "Delete one entry from exactPropertySets against clean schemas; observe exit 1 naming schema.properties.exact.coverage; restore."
  - id: "AC-VF1-04"
    statement: "The new assertions are demonstrably the mechanism doing the work, not something else in the file happening to catch the mutation."
    verification: "Run a copy of the validator with the new loops, both maps and both coverage assertions removed, against the SAME mutated schemas. It must pass every mutation the fixed validator rejects. Record both columns. A control that cannot distinguish the two proves nothing."
  - id: "AC-VF1-05"
    statement: "The full test suite exits 0 on main with this change and the seven updated pins."
    verification: "`node --test tests/*.test.mjs` exit 0. NOTE: run this in a checkout that HAS node_modules. The producer's first attempt returned exit 1 in a fresh worktree solely because ajv was unresolvable, which would have been reported as a pre-existing main failure had it not been checked. A suite result from a tree missing its dependencies is not a baseline."
  - id: "AC-VF1-06"
    statement: "Each of the seven guards fails if the validator drifts again after this change."
    verification: "After re-pinning, append a comment line to tools/validate-foundation.mjs and confirm all seven guards fail; revert. Re-pinning tamper detection without demonstrating it still bites is re-pinning it to nothing."

