  - "The AC-R1-05 two-step: validate exit 1 before the pin update, exit 0 after."
  - "The AC-R1-07 sabotage matrix with its control column."
  - "A count of decision records invalidated. Expected: zero. Any other number stops the work."

valid_until: "2026-11-03T00:00:00Z"

authority_note: >-
  This is a change to contracts/decision-record.schema.json, which nearly every
  governed act in this tree flows through. It is R3 and it is a GOV decision, not
  a producer one.

  What makes it small is the asymmetry: optional in the schema, mandatory at the
  consumer. Zero existing records break; every decision minted from now on either
  says what it authorizes or authorizes no skill. What makes it worth doing is
  that the alternative was measured - one decision, three ALLOWs, two of which
  should not have been.
