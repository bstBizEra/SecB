adversarial_matrix:
  - attack: "Authority bypass by affordance: a 'harmless' approve/retry button added by UI drift"
    gate: "Zero-interactive-elements invariant, mechanically tested; CSP gives injected markup nowhere to send anything; option A has no endpoint"
  - attack: "Injected actions via ledger content: observed_fact carrying script/onerror/form markup executing with operator ambient authority"
    gate: "Universal escaping at every sink + CSP + hostile-fixture negative test - the highest-priority test in the matrix"
  - attack: "Exfiltration beacon: injected img/link/css url() leaking content or IP on open"
    gate: "CSP default-src 'none'; no ledger string becomes a URL; zero absolute URLs outside the template allowlist (tested)"
  - attack: "Credential capture: injected fake 're-enter token' box in a trusted-looking report"
    gate: "No input elements can exist; escaping prevents the markup; fixed banner states the report never asks for credentials"
  - attack: "Cross-origin/localhost actuation (option B class); DNS rebinding"
    gate: "Alpha ships option A - the surface does not exist; GOV-P017-05 records the floor for any future B"
  - attack: "Ledger tamper laundering: render skips verification or renders the unbroken prefix as complete"
    gate: "verify() precedes read() unconditionally; fail-visible; no partial-render mode; nonzero exit"
  - attack: "Whole-chain re-forgery with self-consistent hashes (no external signature root)"
    gate: "Not closable by the UI; headHash + count surfaced for external anchoring; RISK-P017-01 pointed at the P0-13 sealing lineage"
  - attack: "Stale-view decision on an outdated report"
    gate: "Freshness banner + decisions must cite headHash; deny-on-use authority checks live in the services - the UI grants nothing, so staleness cannot authorize"
  - attack: "Classification laundering: 'internal ', 'Public', unicode confusables, novel strings"
    gate: "Exact-match against the four canonical uppercase values; everything else = RESTRICTED withheld with UNRECOGNIZED_CLASSIFICATION; per-variant negative tests"
  - attack: "Report spoofing: forged HTML styled as a real report"
    gate: "Unclosable at artifact level; mitigated by report-is-not-evidence + headHash re-verification as the only trusted path; stated in the footer"
  - attack: "Out-path collision: outPath pointed at the ledger, truncating it via the report write"
    gate: "DENY_OUT_PATH_COLLISION typed refusal; negative test"
  - attack: "Observer input smuggling (V-010 class): a future terminal view accepting keystrokes"
