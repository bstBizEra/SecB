architecture_options:
  - option: "A. Static read-only report generator - pure Node module + CLI: verify() then read() both ledgers, project into view models, write ONE self-contained HTML file (inline CSS, CSP meta default-src 'none'); refresh = re-run"
    benefits:
      - "Zero network surface: no port, no bind, no auth question, no cross-origin, no DNS rebinding, no CSRF - the remote-actuation attack class is structurally absent (strongest Rule 13 conformance)"
      - "Zero new dependencies; the read path is exactly the already-hardened DurableLedger read()/verify()"
      - "Inspectable, diffable artifact; structurally incapable of mutation (no append path in the call graph; byte-identity test proves READ-ONLY mechanically)"
    risks:
      - "Staleness by construction (mitigated by mandatory generatedAt + head hash + count banner, not eliminable)"
      - "Stored-XSS-shaped injection moves into the render path: ledger strings are attacker-influenced and must be escaped everywhere - the option's main, fully testable attack surface"
      - "No live tail; backlog's fleet/terminal/diff ambitions unserved (their substrate does not exist on this baseline)"
  - option: "B. Local server-rendered dashboard - node:http on 127.0.0.1, GET-only, per-launch random token, Host allowlist, re-verify per request"
    benefits:
      - "Fresh reads per request; same projection code; stdlib only"
    risks:
      - "Standing endpoint on the operator machine: loopback binding is NOT auth; DNS rebinding and drive-by localhost probing become live threat classes; one debug route converts observer into actuation surface"
      - "Long-lived ledger file handles interact with the DurableLedger lock in untested ways"
  - option: "C. Live socket console per SECB-LIVE-OPS-ARCH-001 (gateway, mTLS, streams)"
    benefits:
      - "Matches the target-state document"
    risks:
      - "Requires infrastructure that does not exist and is not P0-17's to build; imports dependencies against policy; every intervention affordance is an out-of-scope authority action - building the chassis invites A2+ scope creep without gates"

recommended_option: "A"
recommended_option_rationale: "A is the only option where READ-ONLY is a structural property rather than a policy promise. B is a plausible GOV-gated follow-up (GOV-P017-05); C is target-state. Alpha scope is honest: event and evidence ledger projections only."

service_contract:
  surfaces:
    - "src/ui/report-projections.mjs - pure functions: verified records -> frozen view models (event timeline, per-session view, evidence list, integrity summary, withheld markers); no I/O, no clock, deterministic"
    - "src/ui/ops-report-generator.mjs - generateReport({ eventLedgerPath, evidenceLedgerPath, outPath, classificationCeiling = 'INTERNAL', now }); verify() first, then read(), project, escape, write one HTML file; any LedgerError yields an integrity-failure report, never a normal report"
    - "tools/generate-ops-report.mjs - CLI wrapper; local paths only; nonzero exit when the report is an integrity-failure report"
  may_read:
    - "EventLedger/EvidenceLedger read()/verify() - nothing else: no service resolution, no authority evaluation; the UI displays what the ledger says with the ledger's own words"
  must_never_mutate:
    - "No append path anywhere in src/ui (import-surface test); no write except operator-supplied outPath, never equal to or under a ledger path (DENY_OUT_PATH_COLLISION)"
    - "No network: no http(s)/net imports in src/ui; generated HTML carries CSP default-src 'none' so the artifact cannot phone home even if injection slipped through"
    - "No transition submission, approval, annotation, steer/control/emergency affordance - not as disabled buttons, not hidden: rendered document contains zero form/button/input/event-handler constructs (mechanically asserted)"
  refresh_model:
    - "Refresh is an explicit re-run; no timers, watchers, or daemons (GOV-P009-03 no-timer parity on the read plane)"
    - "Mandatory freshness banner: generatedAt, ledger headHash, record count, 'Snapshot only - re-verify head hash before acting'"

