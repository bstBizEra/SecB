  - "NO NETWORK SURFACE: option A binds nothing; CSP forbids all remote loads; any future option B floor is loopback + per-launch token + Host allowlist + GET-only (Rule 13)"
  - "FAIL-VISIBLE INTEGRITY: verify() failure never yields a normal report; the integrity-failure report shows the typed code and failing sequence and NOTHING of entry contents past the break; CLI exits nonzero"
