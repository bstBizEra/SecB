baseline:
  target_branch: "feat/secb-ruflo-command-center"
  baseline_commit: "efe19ce"
  blast_radius: >-
    Measured, not estimated:
      .ndjson ledger files anywhere in the tree      0
      callers of appendOutcome in src/ or tools/     0
      callers in tests/                              2
        tests/conformance-stubs.test.mjs
        tests/temporal-ledgers.test.mjs

    NO EXISTING OUTCOME RECORD CAN BE INVALIDATED, because none exists. That is
    the same "UNWIRED" condition that made DEF-R1 cheap to close, and it is the
    argument for closing DEF-R4 now rather than after something writes receipts.

scope:
  - "src/ledger/temporal-ledgers.mjs - compare outcome scope against decision scope in appendOutcome; add DENY_DECISION_SCOPE_MISMATCH."
  - "tests/temporal-ledgers.test.mjs - both arms for every case."
  - "docs/04-assurance/ - the before/after evidence record, in the shape of skillshub-walking-skeleton-001.md."

non_scope:
  - "NO schema change. Both contracts already require the fields being compared."
  - "NO wiring. appendOutcome has zero production callers and gains none here."
  - "NO change to DecisionLedger or ClaimLedger."
  - "NO revisiting of DEF-R1. Its fix stands; this closes the sibling case in the same class, which is why WP-SK-R1 named it explicitly rather than letting the class look closed."

acceptance_criteria:
  - id: "AC-R4-01"
    statement: "An outcome inside the decision's scope still appends."
    verification: >-
      The positive arm. A fail-closed change can be made to pass by denying
      everything; this is what makes the denials mean anything. Its absence is
      how the first reproduction attempt produced four denials that looked like
      safety.
  - id: "AC-R4-02"
    statement: "THE THREE REPRODUCED CASES NOW DENY."
    verification: >-
      Re-run the reproduction unchanged. A different project, a different work
      package, and both differing must return DENY_DECISION_SCOPE_MISMATCH where
      they returned ALLOW. Record before and after codes.
  - id: "AC-R4-03"
    statement: "Each scope dimension is refused ON ITS OWN."
    verification: >-
      project_id differing alone, and work_package_id differing alone, each in
      its own ledger. WP-SK-R1's equivalent test initially varied two dimensions
      at once, so one comparison was never exercised and deleting it left the
      suite green. Do not repeat that.
  - id: "AC-R4-04"
    statement: "The existing controls still fire and are not replaced."
    verification: >-
      DENY_UNKNOWN_DECISION for a decision that does not exist, and
      DENY_INCONSISTENT_REVERSION for an INVALIDATED outcome without
      reversion_required. A scope check that swallowed either would be a
      regression disguised as a fix.
  - id: "AC-R4-05"
    statement: "The new code is distinguishable from the old one."
    verification: >-
      DENY_DECISION_SCOPE_MISMATCH must not be reported as DENY_UNKNOWN_DECISION.
      A caller cannot fix a scope error it is told is a missing record.
  - id: "AC-R4-06"
    statement: "Every check is shown failing when it should."
    verification: >-
      Sabotage matrix with raw exit codes and a control column proving the NEW
      comparison is what catches each mutation - not an existing check that
      happened to fire first. WP-GOV-VF1's review found exactly that kind of
      false evidence in this producer's own probe list.

