work_package_id: "WP-GOV-R4"
version: 1
project_id: "prj_secb_local"
module_id: "MOD-GOV"
title: "Bind an outcome receipt to the scope its decision actually covers (DEF-R4)"

objective: >-
  Make OutcomeLedger.appendOutcome refuse an outcome whose project or work
  package is not the one its cited decision was made for.

problem_statement: >-
  Reproduced by running, 2026-08-04, against this branch unchanged:

    the outcome the decision covers                -> ALLOW
    a DIFFERENT project cites the same decision    -> ALLOW
    a DIFFERENT work package, same decision        -> ALLOW
    both differ, same decision                     -> ALLOW

    control: a decision that does not exist        -> DENY_UNKNOWN_DECISION
    control: INVALIDATED without reversion_required -> DENY_INCONSISTENT_REVERSION

  The controls matter. The chain is otherwise sound - a receipt cannot cite a
  decision that does not exist, and the reversion obligation is enforced. What is
  missing is any requirement that the decision COVERS the outcome being claimed.

  The mechanism is the same one DEF-R1 had, in src/ledger/temporal-ledgers.mjs:

    const decision = this.#decisionLookup(outcome.decision_ref);
    if (!decision) throw DENY_UNKNOWN_DECISION;
    const decisionId = decision.entry?.entryId ?? decision.decision_id;
    if (decisionId !== outcome.decision_ref) throw DENY_UNKNOWN_DECISION;

  That compares the looked-up decision's id against outcome.decision_ref - THE
  CALLER'S OWN CLAIM. It detects a miswired lookup. It cannot detect an outcome
  attributing itself to a decision that never covered it.

  A first attempt at this reproduction returned DENY_INVALID_EXPECTED_SEQUENCE
  for all four cases because the harness omitted expectedSequence. Every line
  denied, which reads as a system behaving safely. That run is recorded here
  because a reproduction where nothing gets through proves nothing, and reporting
  it as "DEF-R4 appears closed" was one step away.

design: >-
  Compare the outcome's scope against the decision's, at the ledger, using
  fields BOTH CONTRACTS ALREADY REQUIRE.

    outcome-receipt required:  ... project_id, work_package_id ...
    decision-record required:  ... project_id, work_package_id ...

  NO SCHEMA CHANGE. This differs from DEF-R1, which needed a new `subject` field
  because a decision could not name a skill at all. Here both sides already carry
  the scope; nothing compares them.

  New deny code: DENY_DECISION_SCOPE_MISMATCH, distinct from DENY_UNKNOWN_DECISION
  so a scope violation is not reported as a missing record.

open_design_question: >-
  STRICT EQUALITY IS THE PROPOSAL, NOT A CONCLUSION. It assumes an outcome is
  always observed inside the same work package that took the decision.

  A plausible counter-case: a decision taken in WP-A whose consequence is
  observed while working in WP-B. If that is legitimate in this project, strict
  equality is wrong and will block real work.

  The producer does not know whether that case exists here, and says so rather
  than picking. Two escapes if it does:

    - decision-record already carries `subject` (added by WP-SK-R1). A decision
      whose effects legitimately span work packages could say so there, and the
      comparison would read the declared scope instead of the decision's own
      work_package_id.
    - project_id equality alone, with work_package_id compared only when the
      decision does not declare a wider scope.

  This is the one question in this package the producer wants answered before
  code, because both alternatives are cheap NOW and expensive after a comparison
  ships and records depend on it.

