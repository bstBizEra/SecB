authority_note: >-
  R3 because it changes what a governed ledger accepts, on the receipt that marks
  a decision validated or invalidated. M2 because no contract and no schema
  changes, and there is nothing to migrate.

  What makes it small is the same property that made DEF-R1 small: nothing is
  wired, so nothing breaks. What makes it worth doing now is that this property
  expires. The moment anything writes outcome receipts, closing this stops being
  a comparison and starts being a migration.
