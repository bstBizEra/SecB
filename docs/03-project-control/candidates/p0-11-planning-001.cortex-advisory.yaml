operational_definition_of_handoff:
  - "A handoff is an authoritative, sealed, two-phase record that transfers WORK CONTEXT and a NARROWED SCOPE CEILING from a source session to a destination role - and transfers NO AUTHORITY. The target's authority comes exclusively from the target's own ACTIVE grant, resolved live at acceptance. The envelope is a claim package plus a ceiling; it is never a credential"
  - "Binding tuple at offer: (project_id, work_package_id, bound_wp_version, baseline_version, source_session_id, source_actor_id); bound version and baseline come from live resolveEffective ALLOW at offer time"
  - "Context linkage: context_receipt_ref = (receipt_id, version, content_hash) at the P0-10 chain head; verified via an injected receipt resolver when P0-10 R2 exists; deny-if-present-but-unverifiable before that (GOV-P011-07)"
  - "Ceiling: server-derived (paths, tools/skills/MCP methods, data classification, risk class, transition surface) = intersection of the effective work package contract and the source's grant-derived surface; caller may request narrower, never wider; caller-supplied ceiling values are unknown keys and deny"
  - "A handoff is not evidence acceptance; acceptance obligates the destination to examine authoritative artifacts and evidence directly - encoded as an invariant, not prose"

architecture_options:
  - option: "A. Fold handoff into WorkPackageContractService"
    benefits:
      - "In-process actor history for SoD; reuses accepted hardening"
    risks:
      - "Mutates the under-review P0-09 surface pre-merge (the anti-pattern GOV-P010-01 rejected); conflates work-package lifecycle authority and inter-agent transfer authority in one ledger"
  - option: "B. Standalone HandoffService with snapshots of grants, work packages, receipts"
    benefits:
      - "Isolated blast radius; buildable without waiting on anything"
    risks:
      - "Duplicates resolveEffective and SoD logic; snapshot effectiveness is a stale-authority handoff channel by construction; two executor-set definitions will drift (RISK-P009-01)"
  - option: "C. Dedicated HandoffService composing over injected WorkPackageContractService (resolveEffective + getDecisionLedger, live at offer AND acceptance) and an injected nullable receiptResolver (wired at R2); composed ALLOW is necessary but not sufficient; the handoff service applies its own hardened checks (schema, seal, ceiling comparison, SoD, single-acceptance, chain intersection); either layer's denial denies, handoff-typed denial carrying the underlying reason"
    benefits:
      - "Single live definition of effectiveness and executor history; no snapshot staleness"
      - "Mirrors adopted GOV-P009-01/GOV-P010-01 option-C, including the nullable-resolver phasing already proven by projectResolver (V-002): buildable and V-015-testable before P0-10 R2"
      - "Fail-closed by construction; shared surfaces consumed, never modified"
    risks:
      - "Ledger-derived executor set must be frozen and parity-tested against the service's own SoD outcomes or the two could diverge"
      - "Requires P0-09 merge before R1 implementation (same gate as the P0-10 disposition)"

recommended_option: "C"

service_contract:
  authoritative_record: "Immutable handoff record keyed by (project_id, handoff_id); wraps the schema-valid envelope plus ledger-side metadata the closed schema cannot carry (source actor/session/agent-instance, destination role, derived ceiling, bound wp version, context_receipt_ref, parent_handoff_id, offered_at, expires_at, acceptance record, derived status); content_hash server-computed via canonical-fingerprint with content_hash excluded; caller hash mismatch denies; records deep-cloned and frozen on read; append-only handoff ledger (OFFER, ACCEPT, DECLINE, REVOKE, CHAIN) is the source of truth - status derived by replay"
  public_operations:
    - "offerHandoff(envelope, { idempotencyKey, actorId, authorityRef, sourceSessionId, parentHandoffId? }) - closed shape; source actor must hold an ACTIVE scoped grant; live resolveEffective (record resolved version); server-derived narrow-only ceiling; schema validation; receipt verification via injected resolver when configured, deny-if-present otherwise; seal; server timestamps; string-only idempotency; chained offers intersect the parent's RECORDED ceiling and increment depth"
    - "acceptHandoff(project_id, handoff_id, { actorId, authorityRef, sessionId, baseline, idempotencyKey }) - re-runs live resolveEffective with version equality and triple baseline equality; re-verifies seal and receipt liveness; target must hold its OWN ACTIVE grant assigning destination_role; acceptance-time SoD against the ledger-derived actor history; single acceptance; ACCEPT is a ledger entry; returns the frozen envelope plus the chain-intersected effective ceiling"
    - "declineHandoff(project_id, handoff_id, { actorId, reasonCode }) - terminal, recorded"
    - "revokeHandoff(project_id, handoff_id, { actorId, authorityRef, reasonCode }) - source actor or GOV; terminal; deny-on-use; no cascade writer"
    - "getHandoff / getHandoffLedger - deep-cloned frozen reads; read does not imply acceptability"
  acceptance_resolution:
    - "All checks server-side, fail-closed, typed NONE on any failure: status OFFERED; server time < expires_at where expires_at = min(offered_at + policy TTL, work package valid_until); recomputed hash equality; live resolveEffective ALLOW with version equality; receipt chain head consumable when resolver configured; target grant valid, role matches; SoD clean; ceiling comparison passes; no partial acceptance, no fallback"
    - "Expiry, supersession, revocation are deny-on-use against server clock and live resolution; no timers, no background writers"

non_escalation_invariants:
  - "AUTHORITY NEVER TRANSFERS. Target capability = (target's own live grant) INTERSECT (effective work package contract) INTERSECT (handoff ceiling). Deleting the HandoffService must remove a constraint surface, never an authority source - the design test for every P0-11 feature"
  - "NON-ESCALATION COMPARATOR over six frozen dimensions: (1) risk class R0<R1<R2<R3<R4, target <= source; (2) data classification PUBLIC<INTERNAL<CONFIDENTIAL<RESTRICTED, target <= source; (3) path scope - canonical forward-slash '..'-free paths, subset by lexical containment exactly as V-002; (4) tool/skill/MCP surface - exact-string subset, globs prohibited (a glob is a widening device); (5) transition surface - subset of transition keys; (6) destination_role is a single declared role, never a set. ANY dimension failing, missing, or outside the frozen order yields DENY_ESCALATION or DENY_ESCALATION_UNCOMPARABLE - incomparable IS escalation"
  - "NARROW-ONLY: requested ceiling elements outside the server-derived intersection deny (DENY_ESCALATION), never clamp - clamping hides the attempt from audit"
  - "TRANSITIVITY: chained ceiling = requested INTERSECT parent's LEDGER-RECORDED ceiling; monotonically non-increasing along any chain by induction; a hop may never re-derive from the contract to recover width a prior hop dropped"
  - "CHAIN BOUNDS: parent must be an ACCEPTED handoff on the same (project, wp, version); depth recorded and capped (default 4, GOV-P011-05); append-only ancestry is acyclic in ids; monotone ceilings make A->B->A authority-neutral by construction"
  - "SoD AT ACCEPTANCE: REV target not in ledger-derived executor set; QA not executor/reviewer; GOV not executor/reviewer/qa (mirrors AuthorityEngine + service DENY_SOD); target_actor != source_actor for every independence-bearing role - a self-handoff under a second session is the canonical independence forgery"
  - "SINGLE ACCEPTANCE: exactly one ACCEPT per handoff_id; same-actor same-key same-fingerprint retries replay the original frozen result; anything else denies"
  - "DELIMITER POLICY (named up front, third recurrence of the class): '|' and '@' denied in every id field (DENY_ID_CHARSET); reserved-delimiter set exported as a frozen constant for future services; structured tuple keys preferred internally"
  - "Free-text fields are CLAIMS, never inputs to authority computation; a scope-looking string in a narrative field grants nothing (prompt-injection surface neutralized by construction)"
  - "A handoff is not evidence acceptance: acceptHandoff never writes evidence, satisfies no obligation, advances no state"
  - "Server-derived timestamps; caller times claimed metadata; deep clone/freeze both directions; idempotency string-only with fingerprint-conflict denial"

adversarial_escalation_matrix:
  - attack: "Authority smuggling: source declares a wider ceiling than its own surface"
    gate: "Server-derived intersection at offer; excess denies, never clamps; even a forged ceiling is inert - target actions remain gated by its own grant and live resolveEffective (defense in depth)"
  - attack: "Role minting: ENGIN offers destination_role=GOV to a confederate"
    gate: "Acceptance requires the target's OWN grant assigning the role; the envelope cannot substitute for a grant; SoD excludes executor-affiliated actors; CONFLICTING_ROLES rejects dual-sided grants at construction"
  - attack: "Independence forgery: source accepts its own handoff from a second session or a sock-puppet"
    gate: "target != source for independence-bearing roles + ledger-derived executor/reviewer/qa exclusion; the decision ledger is the actor-history source, not caller assertion"
  - attack: "Chain laundering: B->C re-derives from the contract to recover width A dropped"
    gate: "Chained ceiling intersects the parent's LEDGER-RECORDED ceiling; monotone by induction; recomputation uses stored state only"
  - attack: "Stale-authority handoff: accept after expiry/revocation/supersession"
    gate: "Live resolveEffective at acceptance with resolved-version equality; each condition yields typed NONE deny-on-use"
  - attack: "Context smuggling: receipt ref to another session/WP, superseded parent, revoked chain"
    gate: "Full P0-10 binding-tuple and chain-head liveness via the injected resolver; no resolver configured -> any ref present denies (fail-closed)"
  - attack: "Instruction injection: narrative fields carrying scope-looking text for the consuming LLM"
    gate: "Free-text-is-claims invariant; only the machine-checkable ceiling carries scope; V-015 negative test asserts narrative strings change nothing"
  - attack: "Double acceptance duplicating delegated context"
    gate: "Single-acceptance rule; second ACCEPT denies with pointer; both attempts ledger-visible"
  - attack: "Seal forgery: mutate envelope post-offer with recomputed/placeholder hash"
    gate: "Server recomputes canonical fingerprint at offer and every acceptance; DENY_FINGERPRINT_MISMATCH; independent of and after schema validation"
  - attack: "Delimiter collision: '|' or '@' in ids colliding composite keys or engine objectIds"
    gate: "DENY_ID_CHARSET on the frozen reserved set across every id field"
  - attack: "Baseline drift at acceptance"
    gate: "Triple equality (asserted == envelope == effective contract), exact-commit per GOV-P009-06"
  - attack: "Expiry sliding via claimed timestamps"
    gate: "Server clock only; expires_at = min(TTL, valid_until)"
  - attack: "Classification upgrade: RESTRICTED context labeled INTERNAL"
    gate: "Classification dimension server-derived from contract and receipt metadata; unknown/downgraded values are uncomparable and deny"
  - attack: "Depth bombing: unbounded chains diluting accountability"
    gate: "Recorded depth, hard cap; every hop a ledger entry naming both actors"
  - attack: "Replay divergence: reused key with altered envelope"
    gate: "Canonical fingerprint comparison; conflict denial; replays return the original frozen result"
  - attack: "Read-path mutation of returned envelope/ceiling"
    gate: "Deep clone + freeze both directions; negative test"

negative_test_matrix:
  - "Offer: missing/extra/blank field, non-string scalar, reserved delimiter in any id -> DENY_MALFORMED_ENVELOPE / DENY_ID_CHARSET"
  - "Offer: no effective WP version, expired, baseline mismatch -> denial carrying the resolveEffective reason"
  - "Offer: any ceiling element outside the server-derived intersection -> DENY_ESCALATION; unknown lattice value -> DENY_ESCALATION_UNCOMPARABLE"
  - "Offer: no ACTIVE scoped grant or outside window -> denial; caller ceiling fields -> unknown-key denial; hash mismatch -> DENY_FINGERPRINT_MISMATCH"
  - "Offer: context_receipt_ref with no resolver configured -> denial; with resolver: wrong session/WP, superseded, revoked -> typed denial"
  - "Chained offer exceeding parent's recorded ceiling -> DENY_ESCALATION; past depth cap -> DENY_CHAIN_DEPTH; parent not ACCEPTED or different WP/version -> denial"
  - "Accept: by source actor (independence-bearing role), by executor for REV, executor/reviewer for QA, executor/reviewer/qa for GOV -> DENY_SOD"
  - "Accept: no grant for destination_role, lapsed grant, wrong actor -> typed NONE"
  - "Accept: past expires_at or valid_until -> DENY_EXPIRED; newer WP version effective -> typed NONE; after REVOKE/DECLINE -> typed NONE"
  - "Second accept -> denial with pointer; same-actor same-key same-fingerprint -> stable replay; same key different fingerprint -> conflict"
  - "Accept with divergent baseline -> denial (triple equality)"
  - "Scope-looking narrative string grants nothing: post-acceptance effective ceiling identical to machine-derived ceiling"
  - "acceptHandoff satisfies no evidence obligation and advances no WP state"
  - "Mutation of returned objects does not affect stored state"
  - "Fail-closed composition: resolveEffective ALLOW + handoff-layer denial still denies; handoff pass never overrides resolveEffective NONE"
  - "SoD parity: ledger-derived executor set matches work-package-service DENY_SOD outcomes for the same history (drift canary)"

