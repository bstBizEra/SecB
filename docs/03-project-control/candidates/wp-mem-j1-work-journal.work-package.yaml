  - "A transcript showing AC-J1-02's refusal by deny code."
  - "The AC-J1-06 finding, recorded whichever way it comes out."

valid_until: "2026-11-03T00:00:00Z"

evidence_appendix:
  transcript: |
    === A. a real finding from this session, carrying an exit code ===
      PASS    write evidence at VERIFIED
      PASS    claim citing that evidence

    === B. controls — what must be refused ===
      REFUSED claim citing evidence that does not exist      -> DENY_EVIDENCE_CHAIN
      REFUSED claim citing evidence still at CAPTURED        -> DENY_EVIDENCE_CHAIN

    === C. is the accepted claim ready to become a memory record ===
      projects to: layer, source, statement, classification, confidence,
                   provenance, valid_from, valid_until, retention_policy
      left for the gateway: admitted_at, content_hash, memory_record_id
  reproduction: >-
    The proof script was written in a scratchpad and is ephemeral. Its shape is
    recorded here so a reviewer re-derives rather than trusts: construct an
    EvidenceLedger and a KnowledgeLedger over temporary files, wire the
    knowledge ledger's evidenceLookup to read the evidence ledger, then run the
    four cases above. Two contract shapes bit the producer while writing it and
    are worth knowing before starting: `limitations` is an ARRAY, not a string,
    and `content_hash` must match ^[a-f0-9]{64}$ with no algorithm prefix. The
    contract caught both; the producer did not.

authority_note: >-
  This package implements nothing that changes a control. It writes to two
  ledgers through their existing public methods and relies entirely on their
  existing gates - the strictest of which, DENY_EVIDENCE_CHAIN, is the reason
  the journal is worth having.

  What it does NOT do is the part that needs the operator: reaching SecB Memory
  proper. That requires the merge, a store behind the gateway, and a wiring act
  main itself marks operator-gated. This package is the half that is reachable
  now, and it is shaped so the other half is an admission call rather than a
  migration.
