dependencies_observed:
  - "SECB-FEDERATION-001 invocation flow is the obligation: identity/session verify -> project/work/role policy -> data+network policy -> method-level authz -> bounded credential issuance -> request validation -> invocation -> response validation/redaction -> event/cost/evidence record. On this baseline steps 1 (session) and 5 (bounded credentials) have NO substrate (no session service; receipts are P0-10 R2, gated on the P0-09 merge)"
  - "P0-17 adopted option A (zero network surface) and recorded the option-B floor without pre-authorizing it (GOV-P017-05). The MCP transport question is the same question one layer down"
  - "P0-11 adopted authority-never-transfers (GOV-P011-02), the six-dimension ceiling incl. tool/MCP-method surface (GOV-P011-03), and reserved delimiters {'|','@'} as a frozen system-wide constant (GOV-P011-08)"
  - "P0-10: receipts carry server-derived allowed_tools; CF stubs frozen behind the P0-09 merge gate"
  - "SARCHI-AA-01 (privilege honesty) and SARCHI-AA-02 (no trust infrastructure) apply verbatim: an MCP server runs at the same OS privilege as its callers - checks bind cooperative callers only; nothing it 'verifies' about caller identity is cryptographic"
  - "Operator Rule 13: zero remote risk, no unauthenticated endpoints, no public binding"
  - "RuntimeRegistry.resolve() already implements the APPROVED+ACTIVE-or-quarantine connection-precondition shape, BUT the registry is an in-memory Map - a spawned server has an empty registry unless seeded"
  - "DurableLedger append takes a mkdir single-writer lock (LEDGER_BUSY on contention); invocation ledgering must be designed around it"
  - "Dependency policy: ajv + ajv-formats only, Node >= 22; any new runtime dependency is a GOV exception"
  - "V-014 (credential-bounded MCP invocation) is skipped, BLOCKED on P0-10 + P0-11 - completed jointly with them, never alone"

operational_definition: >
  The SecB MCP Server exposes an enumerated, frozen subset of SecB's
  delivered governed services as MCP tools so agent runtimes can query
  governed state through a policy-enforcing chokepoint instead of
  importing SecB modules with ambient filesystem authority. It is a
  projection of existing authority, never a source of it: every answer
  must be one the caller could obtain by running the underlying service
  under the same policy, and deleting the server must remove a
  convenience, never an authority (the P0-11 design test). Alpha is
  read-only; actuation via MCP is a separate, later, credential-gated
  phase.

architecture_options:
  - option: "A. stdio child-process server - JSON-RPC 2.0 over stdin/stdout, spawned per client; no socket/port/bind; in-process composition; tools-only (no resources, no prompts)"
    benefits:
      - "Zero network surface: no endpoint can be unauthenticated because none exists - the MCP analogue of P0-17 option A, structurally satisfying Rule 13"
      - "Process lifetime = session lifetime: per-spawn isolation gives a natural session boundary without inventing a session service"
      - "The OS process spawn is the authentication event the platform actually provides - honest about SARCHI-AA-01"
      - "DNS rebinding, localhost probing, CSRF, cross-origin, token leakage: entire remote-actuation class absent by construction"
    risks:
      - "1:1 transport means no shared state: the in-memory registry is empty per spawn and must be hydrated from an operator seed file - which becomes the real authorization store (stated, mitigated, tested)"
      - "Caller identity is whatever the spawning process asserts (pre-existing RISK-P010-06); alpha stays read-only precisely because of it"
      - "No fan-in observability across spawns; reconciliation is by ledger merge at read time"
  - option: "B. Local HTTP/SSE server - standing loopback endpoint"
    benefits: ["One server, many clients; shared state; matches hosted-MCP direction"]
    risks:
      - "Re-imports everything P0-17 option A was adopted to exclude; loopback is not auth; the GOV-P017-05 floor is the minimum and was NOT pre-authorized even for the read-only display plane - a tool-invocation plane is strictly more dangerous"
  - option: "C. In-process library adapter - no server; each runtime self-hosts tool definitions"
    benefits: ["Zero new code beyond wrappers; no transport"]
    risks: ["No chokepoint: no invocation ledgering, redaction, or method allowlist - every SECB-FEDERATION-001 step becomes voluntary; the status quo the capability doc exists to end"]

recommended_option: "A"
recommended_option_rationale: "A is the only option where 'no unauthenticated remote endpoint' is structural; it inherits the adopted P0-17 option-A rationale and keeps the option-B floor available for a future separately-packeted request. C is the absence of governance."

dependency_decision:
  question: "Hand-rolled JSON-RPC 2.0 stdio subset vs @modelcontextprotocol/sdk"
  recommendation: >
    Hand-roll for alpha with three mitigations for spec-drift risk:
    (1) pin one protocol version and REFUSE initialize for any other with
    a typed error naming the pinned version - never silent best-effort;
    (2) implement the frozen five-method subset only (initialize,
    tools/list, tools/call, ping, notifications/initialized), everything
    else method-not-found (deny-by-default protocol layer); (3) record
    SDK adoption as a standing GOV question (GOV-MCP-02) re-asked at the
    mutation phase. Authorization lives in SecB services either way, so
    hand-rolling framing bytes is not the roll-your-own-auth mistake.

service_contract:
  surfaces:
    - "src/mcp/jsonrpc-stdio.mjs - newline-delimited JSON-RPC 2.0 over stdio; parse errors answered per spec, never crash; max message size; unknown methods -> method-not-found"
    - "src/mcp/tool-catalog.mjs - FROZEN alpha catalog: names, ajv-compiled param schemas, static descriptions; deep-frozen; tools/list is a pure projection"
    - "src/mcp/secb-mcp-server.mjs - dispatch pipeline: caller resolution -> method allowlist -> param schema validation -> reserved-delimiter scan on id fields -> request fingerprint -> service invocation -> classification-floor redaction -> invocation ledger append -> respond"
    - "tools/run-secb-mcp-server.mjs - CLI entry; takes registry seed path, ledger paths, ceiling, caller instance-id assertion; refuses to start with missing/invalid seed"
  alpha_tool_allowlist_exact:
    - "secb_work_package_resolve_effective(project_id, work_package_id, baseline?)"
    - "secb_project_resolve_effective(project_id, baseline?) - only after P0-09 merge lands ProjectContractService on the baseline"
    - "secb_ledger_verify_summary(ledger) -> { verified, headHash, count }; NEVER entry contents"
    - "secb_events_read(ceiling?) / secb_evidence_read(ceiling?) - verified, classification-floored projections reusing src/ui/report-projections.mjs; verify() before read(); full-stop typed failure on broken chain"
    - "secb_skill_resolve(skill_id, version, context) - policy query verdict"
    - "secb_registry_resolve(agent_instance_id) - identity-or-quarantine projection"
    - "secb_contract_validate(kind, document) / secb_canonical_fingerprint(document) - pure functions"
  deliberately_excluded_from_alpha:
    - "ALL TransitionEngine submissions, registry writes, ledger appends (except the server's own invocation records), AuthorityEngine evaluation, receipt issuance/consumption, handoff operations, and report FILE generation (a tool taking outPath is a caller-controlled write primitive)"
  rationale_for_read_only: >
    A tool that submits an envelope is an actuation surface whose caller
    identity cannot currently be verified: no session service, asserted
    agent-instance id, no issuable bounded credentials. Mutation via MCP
    is a separate work package gated on that substrate, entering through
    V-014.

invariants:
  - "OBSERVER-ONLY: zero mutation paths; ledger byte-identity across every alpha call is the mechanical proof, except the server's own invocation ledger"
  - "NO NETWORK SURFACE: no node:http/https/net imports under src/mcp (import-surface test); Rule 13 structural; future HTTP starts from the GOV-P017-05 floor plus its own packet"
  - "AUTHORITY NEVER ORIGINATES HERE: every ALLOW is the underlying service's ALLOW under the caller's context; the server adds denials, never permissions; deleting it strands no capability"
  - "CALLER PRECONDITION: tools/call served only when the asserted agent_instance_id resolves APPROVED+ACTIVE against the seeded registry. HONESTY CLAUSE (SARCHI-AA-01): binds cooperative callers only; the boundary is the OS process spawn, stated everywhere the property is claimed"
  - "SERVER SELF-REGISTRATION: the server ships a registration record (owner, version, methods=catalog, classification, evaluation, lifecycle) validated at startup; a server whose own record does not resolve refuses to serve"
  - "CLASSIFICATION FLOOR: effective ceiling = min(operator config, caller max_data_classification), default INTERNAL; exact-match lattice, unknown -> RESTRICTED withheld; P0-17 display-plane projection reused verbatim, never a second implementation"
  - "RESERVED DELIMITERS: every id-typed param scanned with findReservedDelimiter; '|'/'@' -> DENY_RESERVED_DELIMITER before any service is touched (GOV-P011-08 constant consumed, not copied)"
  - "REQUEST IDEMPOTENCY: each call canonicalized+fingerprinted (canonicalFingerprint over {tool, params, caller}); fingerprint is the invocation ledger dedupe key; identical in-session replay returns replayed:true referencing the prior sequence"
  - "FAIL-CLOSED TYPED DENIALS: every refusal a typed code in JSON-RPC error data; no free-text-only denials; no silent empty results standing in for denials"
  - "INVOCATION LEDGERING: every call (allowed OR denied) appends one event to a DEDICATED invocation EventLedger (never HostRuntimeAgent's, to avoid its single-writer lock) recording tool, caller assertion, fingerprint, decision code, ceiling, duration; raw above-ceiling params NOT stored"
  - "LEDGER-APPEND FAILURE IS FAIL-CLOSED: if the invocation record cannot append (LEDGER_BUSY after one bounded retry, or any LedgerError), the call is answered DENY_AUDIT_UNAVAILABLE and results withheld - an unauditable read channel is a covert channel for classified content"
  - "DATA-NOT-INSTRUCTIONS: results are structured JSON under claims-typed keys with a fixed {content_disposition: 'data_untrusted'} marker; the server never emits imperative/model-directed text; tool descriptions are frozen static constants - ledger/caller text can never reach the description channel"
  - "SERVER CLOCK ONLY for ledger timestamps via injectable now(); occurred_at relayed as recorded claims"

adversarial_matrix:
  - attack: "Confused deputy: low-privilege agent asks for data/actions its own policy denies, hoping the server's ambient authority answers"
    gate: "Server holds no credentials; composes the caller's context into every call; ceiling = min(server, caller); alpha has no actions; authority-never-originates is the review design test"
  - attack: "Identity spoofing: caller asserts another instance's id at initialize"
    gate: "Unclosable at this substrate and SAID SO: assertion ledgered for audit; consequence bounded by read-only + classification floor; durable fix is the session/credential substrate (mutation-phase gate)"
  - attack: "Registry seed tampering to mint APPROVED/ACTIVE or raise max_data_classification"
    gate: "Seed schema-validated; its fingerprint ledgered at startup and echoed in verify_summary; OS file permissions are the real boundary (SARCHI-AA-01 honesty)"
  - attack: "Prompt injection via returned data steering the consuming LLM"
    gate: "data_untrusted marker + claims-typed fields + no imperative server text; not fully closable server-side (consumer renders it); residual stated, hostile fixtures shipped"
  - attack: "Tool-description injection (descriptions carrying model instructions)"
    gate: "Descriptions are frozen constants; tools/list byte-snapshot tested; no dynamic content reaches the channel; Immune reads every description verbatim"
  - attack: "Rug-pull: catalog silently changes between sessions, widening surface"
    gate: "Catalog deep-frozen; snapshot test; catalog fingerprint in the self-registration record and startup ledger - a changed catalog is a changed registration needing re-evaluation"
  - attack: "Method smuggling (resources/prompts/completion, batch, notification abuse)"
    gate: "Deny-by-default dispatch: five methods, everything else method-not-found; no resources/prompts in alpha; batch elements gated identically or rejected"
  - attack: "Reserved-delimiter injection in id params"
    gate: "findReservedDelimiter pre-dispatch -> DENY_RESERVED_DELIMITER; per-field negative tests"
  - attack: "Classification laundering through the new plane"
    gate: "Exact-match lattice, unknown -> RESTRICTED withheld; SAME projection code as the adopted P0-17 plane"
  - attack: "Audit starvation: hold the invocation ledger lock so calls can't be recorded"
    gate: "Fail-closed DENY_AUDIT_UNAVAILABLE; dedicated ledger file bounds blast radius; lock-squat is an OS-privilege attack (SARCHI-AA-01)"
  - attack: "Resource exhaustion (giant/nested params, unbounded reads)"
    gate: "Max message size at framing; ajv schema maxima; read caps with explicit truncation markers (truncated:true + total), never silent"
  - attack: "Out-path/file-write primitive via a path argument"
    gate: "No alpha tool accepts a path; catalog schema review asserts it; report file generation excluded"
  - attack: "Stale-result action: caller acts on a stale resolveEffective ALLOW"
    gate: "Responses carry resolved_at + baseline/fingerprint; deny-on-use lives in services at actuation; the MCP plane grants nothing, so staleness cannot authorize"

negative_test_matrix:
  - "tools/call with unregistered/CANDIDATE/SUSPENDED/DEACTIVATED/TERMINATED caller -> typed deny with quarantine reason; nothing invoked"
  - "Unknown tool -> method-level deny; unknown JSON-RPC method -> method-not-found; malformed JSON -> parse error response, process survives"
  - "initialize with non-pinned protocolVersion -> typed refusal naming the pinned version; no degraded mode"
  - "Params failing ajv schema -> DENY_INVALID_PARAMS with pointer, service untouched"
  - "'|' and '@' in each id-typed param of each tool -> DENY_RESERVED_DELIMITER"
  - "RESTRICTED entries at INTERNAL effective ceiling -> withheld, payload absent from response bytes; caller max below server ceiling -> min() governs; unknown variants -> RESTRICTED-withheld"
  - "Tampered event ledger -> secb_events_read full-stop typed integrity failure, zero entries, no partial"
  - "Lock squat on invocation ledger -> DENY_AUDIT_UNAVAILABLE, result withheld, one bounded retry"
  - "Ledger byte-identity across the full alpha sweep; only the invocation ledger grows"
  - "Denied calls ledgered too: exactly one invocation record with the deny code"
  - "Idempotent replay: identical request twice -> second replayed:true, one service invocation, two records one fingerprint"
  - "Hostile fixtures in ledger content -> returned inside JSON strings under claims keys with data_untrusted; string-scan asserts no fixture text outside a JSON string value"
  - "tools/list byte-snapshot equals frozen catalog; catalog mutation throws (deep-freeze)"
  - "Import-surface scan: no node:http/https/net, no child_process, no append-capable governed-ledger construction (except the invocation ledger) under src/mcp"
  - "Startup with missing/invalid/fingerprint-mismatched seed -> refuse to serve, typed error, nonzero exit"

