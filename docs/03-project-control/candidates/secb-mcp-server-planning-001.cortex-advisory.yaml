blocking_decisions_for_human_gov:
  - id: "GOV-MCP-01"
    question: "Approve stdio child-process transport (option A) for alpha, HTTP/SSE deferred behind the GOV-P017-05 floor plus a dedicated adversarial packet?"
    recommendation: "Approve A - the only transport where Rule 13 holds structurally; a tool-invocation endpoint is strictly more dangerous than the display endpoint GOV declined to pre-authorize"
  - id: "GOV-MCP-02"
    question: "Hand-rolled pinned JSON-RPC subset (zero deps) vs @modelcontextprotocol/sdk (spec tracking, supply-chain surface on the trust boundary)?"
    recommendation: "Hand-roll for alpha with pinned version, deny-by-default methods, unpinned-version refusal; re-ask SDK adoption at the mutation phase - do not let it be inherited silently"
  - id: "GOV-MCP-03"
    question: "Ratify the exact eight-tool read-only alpha allowlist, including the exclusions of AuthorityEngine evaluation and report file generation?"
    recommendation: "Ratify as enumerated; additions are catalog changes requiring re-registration and Immune re-review, never patch edits"
  - id: "GOV-MCP-04"
    question: "Accept the caller-identity honesty position (asserted id resolved against a seeded registry; enforcement boundary is the OS spawn; mutation tools blocked until a session/credential substrate exists)?"
    recommendation: "Accept - SARCHI-AA-01 shows over-claiming gets rejected at SEC review; read-only scope is the compensating control"
  - id: "GOV-MCP-05"
    question: "Confirm effective ceiling = min(server config, caller max), default INTERNAL, exact-match, unknown -> RESTRICTED; above-INTERNAL server ceiling requires an explicit CLI argument?"
    recommendation: "Confirm - verbatim reuse of GOV-P017-02 on a second plane; one lattice implementation, never two"
  - id: "GOV-MCP-06"
    question: "Invocation ledgering fail-closed (DENY_AUDIT_UNAVAILABLE) vs fail-open (serve reads, log loss)?"
    recommendation: "Fail-closed, dedicated file, one bounded retry - SECB-FEDERATION-001 makes the event record part of the invocation; an unauditable channel for classified reads is the exact hole an auditor looks for"
  - id: "GOV-MCP-07"
    question: "Roadmap slot and naming: new numbered stream (e.g. P0-19 'SecB MCP Server') vs extension; priority relative to the merge queue and P0-10 R2?"
    recommendation: "New numbered stream, sequenced BEHIND the P0-09 merge and P0-10 R2; baseline on post-merge main so ProjectContractService and the P0-11 constants are present"
  - id: "GOV-MCP-08"
    question: "Server self-registration: confirm the server ships and validates its own record (methods=catalog fingerprint, classification, evaluation, lifecycle) and refuses to serve when it does not resolve APPROVED+ACTIVE?"
    recommendation: "Confirm - SECB-FEDERATION-001's first sentence is server registration; self-refusal keeps the record load-bearing (honesty clause applies: operator controls both sides)"
  - id: "GOV-MCP-09"
    question: "Protocol version pinning: refuse non-pinned initialize outright vs best-effort compatibility?"
    recommendation: "Refuse outright with a typed error - silent best-effort against a moving spec is how request-path validation gaps open"

non_blocking_risks:
  - id: "RISK-MCP-01"
    statement: "MCP spec drift will eventually break a client against the pinned hand-rolled subset"
    mitigation: "Pinned-version refusal makes breakage loud and typed, not corrupt; GOV-MCP-02 is the escape path"
  - id: "RISK-MCP-02"
    statement: "The consuming LLM may still treat data_untrusted results as instructions"
    mitigation: "Hostile fixtures shipped as a consumer test kit; marker documented; residual stated (free-text-is-claims parity)"
  - id: "RISK-MCP-03"
    statement: "In-memory registry + per-spawn processes makes the seed file de facto authorization state without durable lineage"
    mitigation: "Seed fingerprint ledgered at startup and surfaced in verify_summary; durable hydration a candidate follow-up"
  - id: "RISK-MCP-04"
    statement: "Invocation ledger grows forever (every call incl. denials)"
    mitigation: "Dedicated file bounds blast radius; compaction inherits GOV-P010-03 chain-and-supersede, never in-place rewrite"
  - id: "RISK-MCP-05"
    statement: "Result caps with truncation markers may hide tail entries"
    mitigation: "truncated:true + total + cursor-by-sequence; never silent; full fidelity via the local report generator"
  - id: "RISK-MCP-06"
    statement: "Two planes (P0-17 reports, MCP results) projecting the same ledgers can drift if projections fork"
    mitigation: "Single shared projection module consumed by both; import-surface test asserts no second implementation under src/mcp"

