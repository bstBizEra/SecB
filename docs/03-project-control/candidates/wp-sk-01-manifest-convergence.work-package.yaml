acceptance_criteria:
  - id: "AC-01"
    statement: "contracts/skill-package-descriptor.schema.json exists, is draft 2020-12, type object, additionalProperties false, and required is non-empty."
    proof: "node --test over the contract-validator suite; tools/validate-foundation.mjs schema closure check passes."
  - id: "AC-02"
    statement: "contracts/skill-grant-record.schema.json exists with the same closure properties, and its required set contains none of the author-declarable fields listed in ADR-0013."
    proof: "A test asserts the two schemas' required sets are disjoint apart from the join keys skill_id and version."
  - id: "AC-03"
    statement: "package_name is patterned ^[a-z0-9-]{1,64}$ in the descriptor, and display_name is a separate free-text field."
    proof: "Schema assertion test."
  - id: "AC-04"
    statement: "All 22 manifest-carrying packages validate against the descriptor."
    proof: "A test iterates .agents/skills/*/manifest.yaml, maps each to a descriptor, and validates. Count asserted equal to 22, not merely greater than zero."
  - id: "AC-05"
    statement: "The hub's identity binding uses package_name and a package whose descriptor package_name differs from its directory is denied DENY_IDENTITY_MISMATCH."
    proof: "Existing AC-SKILLS-HUB-06b extended to the new field."
  - id: "AC-06"
    statement: "A descriptor carrying any grant field is rejected by the validator rather than ignored."
    proof: "Negative test submitting a descriptor with project_scopes; asserts a validation error, not a silent drop."
  - id: "AC-07"
    statement: "mutation_class is absent from both new contracts."
    proof: "Schema assertion test."
  - id: "AC-08"
    statement: "The resolver computes effective authority ceiling as min(agent, skill) and this is expressed in exactly one place."
    proof: "Unit test over the ceiling composition; a grep-style test asserts no second implementation."
  - id: "AC-09"
    statement: "npm run validate reports zero FAIL, and the full suite excluding tests/mcp-hub-launcher.test.mjs reports zero failures."
    proof: "Producer-run; recorded as evidence, not as acceptance."
  - id: "AC-10"
    statement: "The resolver registry remains empty and no production wiring calls registerSkill."
    proof: "The DEF-C3 registry gate. A test asserts no non-test caller of registerSkill exists."

test_plan:
  - "Positive: each of the 22 packages maps and validates."
  - "Negative: descriptor with a grant field; grant record with an authored field; package_name not matching directory; package_name violating the pattern."
  - "Regression: the full existing SkillsHub suite, including the AC-SKILLS-HUB-06b/06c identity-binding pins and AC-SKILLS-HUB-11 getSkill unreachability."
  - "Migration: contract version bump with a migration test per persisted revision, per FR-SKM-006."
  - "Restart: none applicable - no persisted runtime state is introduced."

review_plan:
  - "REV: verify the two schemas against ADR-0013 field-by-field, and hunt for any path by which an author-supplied value reaches an authorization decision."
  - "REV: confirm the 22 migrated descriptors introduce no fabricated owner, source, or purpose values."
  - "QA: re-run validate and the suite at the delivered commit and confirm AC-01 through AC-10 independently."

security_plan:
  - "SEC review is owed because this is R3 and touches authorization scope."
  - "Specific question for SEC: does the descriptor/grant split fully close DEF-A5, or does a residual path remain by which a registered manifest sets its own ceiling."
  - "Secret scan over all changed files before handoff."

evidence_destination: "SecB Evidence Ledger - accepted by the Evidence authority, not by the producer (FR-SKP-011)"

human_approval_requirements:
