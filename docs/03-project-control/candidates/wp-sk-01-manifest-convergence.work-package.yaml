schema_version: "0.1"
record_metadata:
  record_id: "wp_sk_01_manifest_convergence_v1_candidate"
  record_status: "AUTHORIZED_CANDIDATE"
  source_template: "docs/templates/work-package.yaml"
  producer_runtime: "Claude Code"
  limitations:
    - "The producer of this work package is also its assigned ENGIN. It may not review or accept its own output; REV and QA identities must be distinct."
    - "The producer has been independently found in error three times on this programme. Acceptance criteria below are written to be machine-checkable for that reason."

work_package_id: "WP-SK-01"
project_id: "prj_secb_local"
product_id: "SECB-PRD-SKILLSHUB-001"
module_id: "MOD-SKILL"
goal_id: "GATE-SK-01"
title: "Skill manifest convergence - trust-tier split"

objective: >-
  Implement ADR-0013: replace the single mixed-tier skill manifest with an
  author-written skill-package-descriptor and a service-written
  skill-grant-record, split name into package_name and display_name, and migrate
  the 22 manifest-carrying packages onto the descriptor.

problem_statement: >-
  Four descriptions of a skill manifest exist and disagree. Zero of 22 on-disk
  manifests validate against the governed contract, failing on a shared field.
  The governed contract mixes fields an author may declare with fields only a
  promotion may grant, and the resolver reads three of those grants straight from
  the caller-supplied manifest as its authorization ceiling (DEF-A5). The hub's
  identity binding depends on a name-equals-directory constraint that only the
  unenforced schema encodes (DEF-A4).

desired_outcome: >-
  One authored contract and one granted contract, joined on skill_id@version,
  with all 22 packages validating against the authored one and no package able
  to declare its own authorization scope.

non_goals:
  - "Building intake, evaluation, promotion, or distribution. Those are WP-SK-02 onward."
  - "Populating the resolver registry. Explicitly gated by the DEF-C3 ruling until Phase 5 completes."
  - "Adding content_classification. Ruled out by SECB-SEC-DECISION-SKILLSHUB-C3-001 Ruling B."
  - "Deciding OD-SK-10. ADR-0013 carries it forward unresolved."
  - "Resolution-time digest verification (DEF-B1, DEF-C2). Phase 5."
  - "Editing .agents/ - PACK.yaml declares mutation_authorized: false."
  - "Editing src/mcp/ - concurrent work by another producer."

risk_class: "R3"
mutation_class: "M2"
mutation_rationale: >-
  Isolated non-production mutation. Contracts and package descriptors change; no
  authoritative ledger is written, no registry is populated, no authority is
  issued. This is deliberately lower than WP-SK-05, which mints governance
  decisions and is classified M3.

