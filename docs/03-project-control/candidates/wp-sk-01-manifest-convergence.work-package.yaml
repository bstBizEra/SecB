  expiry: "Authorization lapses if not started within 30 days, or on any change to ADR-0013."
budget: "Not tracked at this stage; Phase 3 is the first work package where budget is expected to bind."

checkpoint_rules:
  - "Checkpoint after the two contracts exist and before any package is migrated."
  - "If the 22 migrations cannot complete without fabricating a field, STOP and return to ARCHI - that is evidence the tier split is wrong."
rollback_plan: >-
  Every change is additive until the validate-foundation pin is updated. Revert
  is a git revert of the work package's commits; no data migration, no registry
  state, and no ledger entries are created, so rollback is complete and leaves no
  residue.
recovery_rules:
  - "On interruption, resume from the last checkpoint; no partial state persists outside git."
integration_rules:
  - "Serialized merge per house practice. Rebase onto the branch tip before handoff."
  - "src/mcp is under concurrent work by another producer; conflicts there indicate a scope breach, not a merge to resolve."
activation_rules:
  - "None. This work package activates nothing."

learning_obligations:
  - "Record whether the tier split actually prevented a grant from being author-supplied, or merely relocated the obligation - this is the load-bearing claim of ADR-0013."

