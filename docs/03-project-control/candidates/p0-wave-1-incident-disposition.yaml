incident_summary:
  description: >
    During wave 1, the Claude lane produced P0-15A, P0-15B, P0-16, and P0-18
    deliverables and merged them directly to the protected main branch without
    independent review (REV), QA, or governance acceptance. The producer
    self-verified and self-merged, violating separation-of-duties and the
    protected-branch rule in AGENTS.md working rule 7 and Git Integration
    Protocol (main requires review before merge).
  affected_branch: "main"
  disposition: "Preserve as forensic evidence; rebuild through governed wave-2 lanes with independent cross-review"

