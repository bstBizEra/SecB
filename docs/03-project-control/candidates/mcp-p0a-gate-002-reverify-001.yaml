finding_under_review:
  id: "GATE2-BLOCKING-001"
  title: "Capacity-exhaustion DoS from an unbounded await in the audit-timeout recovery path"
  gate_002_required_action: >-
    Apply the same boundedCall/timeout-race pattern to the recovery await in
    #scheduleAuditTimeout, so a hung audit sink cannot indefinitely retain a
    capacity-lane reservation.

diff_review:
  diff_range: "60bbb6a..770aebb"
  files_changed: 2
  files:
    - "src/gateway/mcp-gateway-core.mjs (+16, purely additive)"
    - "tests/mcp-gateway-core-adversarial.test.mjs (+68, two new regression tests)"
  change_is_additive_only: true
  no_other_behavior_changed: >-
    Confirmed. The only production edit is inside #holdCapacity (src lines
    ~356-378): a setTimeout `abandon` bound of this.#timeouts.audit_ms * 4 that,
    on fire, does reservation.pending.delete(settlement) and
    #releaseCapacityIfComplete(reservation); plus a clearTimeout(abandon) added
    to the existing .finally() handler. No lines removed, no other method
    touched, no imports added (module remains pure/no-I/O).

  mechanism_divergence_from_required_action:
    observed: >-
      The fix is NOT placed at #scheduleAuditTimeout's `await outcome.settled`
      as the gate-002 required_action literally specified. It is placed one
      layer lower, in #holdCapacity — the single shared primitive that
      #call (raw hook/adapter timeouts), #scheduleAuditTimeout (audit-sink
      hang recovery), and #scheduleLateSettlement (late-settlement evidence)
      all route their retained settlements through.
    reviewer_assessment: >-
      The divergence is justified and is a STRICTLY SUPERIOR fix, not a
      deviation-defect. Independently confirmed: the wedge is reachable via a
      never-settling ADAPTER, whose settlement is retained by #call ->
      #holdCapacity (src line 383), a path that never enters
      #scheduleAuditTimeout at all. The literal required_action would
      therefore have left the adapter-hang variant of the wedge OPEN. Placing
      the bound in #holdCapacity closes all three retention sites uniformly.
    pattern_note: >-
      The bound is implemented as a setTimeout-based abandonment timer rather
      than boundedCall's Promise.race. It does not (and in JS cannot) force the
      underlying hung promise to settle; it only stops counting it against
      capacity after the bound. If the promise later settles, the existing
      .finally() fires as a safe no-op against the already-abandoned entry
      (clearTimeout guards double-release). Semantically sound.

empirical_results:
  harness: >-
    max_concurrency: 1, adapter = () => new Promise(() => {}) (never settles),
    all timeouts 20ms so abandonment bound = audit_ms*4 = 80ms. First invoke,
    then probe subsequent invokes immediately, past the bound, and long past it.
  pre_fix_60bbb6a:
    first_call: "DENY_ADAPTER_TIMEOUT_PENDING (times out and denies — expected)"
    immediately_after: "DENY_CONCURRENCY_LIMIT"
    after_bound_200ms: "DENY_CONCURRENCY_LIMIT"
    after_long_700ms: "DENY_CONCURRENCY_LIMIT"
    result: "WEDGED — capacity slot never drains; every subsequent call denies
      DENY_CONCURRENCY_LIMIT for the process lifetime. Original defect reproduced."
  post_fix_770aebb:
    first_call: "DENY_ADAPTER_TIMEOUT_PENDING"
    immediately_after: "DENY_CONCURRENCY_LIMIT (slot correctly still held right after timeout)"
    after_bound_200ms: "DENY_ADAPTER_TIMEOUT_PENDING (slot reclaimed — request got PAST the capacity gate)"
    after_long: "DENY_ADAPTER_TIMEOUT_PENDING (drains again; each new call that reaches
      the adapter re-occupies then re-releases the slot on its own bound)"
    result: "CAPACITY DRAINS — subsequent calls are no longer permanently
      DENY_CONCURRENCY_LIMIT. Blocking finding empirically closed."
  interpretation: >-
    The discriminating signal is DENY_ADAPTER_TIMEOUT_PENDING (request passed the
    capacity gate and reached the adapter) vs DENY_CONCURRENCY_LIMIT (blocked at
    the gate, slot held). Pre-fix stays permanently at the latter; post-fix
    returns to the former after the abandonment bound. Conclusive.

