regression_test_quality:
  tests_reviewed:
    - "a hung adapter's capacity reservation is abandoned on a bound, not held forever"
    - "a hung hook does not permanently wedge the shared overflow-audit lane"
  exercises_the_wedge: true
  non_tautological_proof: >-
    Ran the post-fix test file (both new tests included) against the PRE-fix
    core (60bbb6a): 34 tests, 32 pass, 2 FAIL — exactly the two new regression
    tests fail on unfixed code, and both pass on 770aebb. A tautological test
    would pass on both. These detect the wedge: they assert a fresh request
    after the abandonment window reaches DENY_ADAPTER_TIMEOUT_PENDING (past the
    gate) rather than DENY_CONCURRENCY_LIMIT, and that three queued overflow
    responses plus a later request all complete rather than hang.

