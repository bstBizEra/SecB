new_non_blocking_findings_to_carry_forward:
  - id: "GATE3-NOTE-001"
    title: "Latent timer-overflow edge case in audit_ms * 4 arithmetic"
    found_by: "REV"
    description: >-
      #holdCapacity computes audit_ms * 4 with no re-clamp against
      MAX_NODE_TIMEOUT_MS. normalizeTimeouts only validates audit_ms
      itself against that ceiling, not the product. An (still-valid)
      audit_ms above ~536,870,911ms (~6.2 days) makes the product exceed
      Node's signed-32-bit timer ceiling; Node clamps such setTimeout
      delays to ~1ms, so abandonment would fire almost immediately
      instead of after the intended 4x grace window, releasing capacity
      for a legitimately-slow (not hung) call. Unrealistic at
      default/typical configs (audit_ms=250ms) but a genuine latent gap
      in this round's new timer arithmetic.
    disposition: NON_BLOCKING_TRACKED
    recommended_fix: "Math.min(audit_ms * 4, MAX_NODE_TIMEOUT_MS), or explicit validation at construction."
  - id: "GATE3-NOTE-002"
    title: "Unbounded memory growth under sustained repeated hangs (companion to gate-002 residual b)"
    found_by: "REV and SEC, independently"
    description: >-
      Reclaiming #capacityInUse cannot make the underlying never-settling
      promise itself settle (no cross-realm cancellation in JS). A hook
      that hangs repeatedly, once per reclaimed slot, indefinitely, leaks
      one orphaned promise chain (closure over context/capability/
      reservation) per hang, for the process's lifetime -- slow,
      unbounded memory growth even though the INSTANT capacity-wedge DoS
      (GATE2-BLOCKING-001's literal concern) is fully closed. SEC
      confirmed via an 8-wave probe that #capacityInUse itself returns
      cleanly to baseline every time while, by construction, 8 orphaned
      chains remain live. This is not a regression -- the pre-fix state
      was strictly worse (capacity itself wedged permanently) -- and it
      is already implicitly covered by gate-002's residual (b) (forced
      preemption impossible in JS), but it was not explicitly enumerated
      as a companion risk until this round's independent review.
    disposition: NON_BLOCKING_ROUTE_TO_OPERATOR_ADR_QUEUE_ALONGSIDE_RESIDUAL_B
  - id: "GATE3-NOTE-003"
    title: "Recommend promoting SEC's ad hoc late-settlement-durability probe to a permanent test"
    found_by: "SEC"
    description: >-
      The shipped test suite does not cover the case where an abandoned
      reservation's operation LATER actually settles and its
      LATE_SETTLEMENT_* audit entry must still be written. SEC verified
      this holds via an ad hoc, uncommitted probe. Recommend the producer
      add an equivalent permanent regression test in a future round.
    disposition: NON_BLOCKING_FOLLOW_UP_FOR_NEXT_ROUND

