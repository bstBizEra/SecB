acceptance_criteria:
  - id: "AC-VS-01"
    statement: "A promotion path constructs the governed manifest from a governance decision and accepted evidence. It reads NO grant field from package content."
    proof: "A test supplies a package manifest declaring project_scopes, supported_runtimes and max_data_classification, and asserts the produced governed manifest's values come from the decision and not from the package. This is the DEF-A5 control for this slice, and it works against the legacy contract without the tier split."
  - id: "AC-VS-02"
    statement: "registerSkill has exactly ONE production caller: the promotion path."
    proof: "Extend the AC-10 walk to assert one caller rather than zero, and assert it is the promotion module. Verified by adding a second caller and confirming the test fails."
  - id: "AC-VS-03"
    statement: "Both wirings bind decisionLookup to a real DecisionLedger through resolveEffective at a trusted instant, never to a constant."
    proof: "A test asserts no wiring contains `decisionLookup: () => null`. Verified by reverting one wiring and confirming failure."
  - id: "AC-VS-04"
    statement: "One pilot skill resolves ALLOW through SecBSkillsHub for a caller in scope, with a real decision in the ledger."
    proof: "End-to-end test: mint decision, promote, search, assert count 1 and the skill body is returned."
  - id: "AC-VS-05"
    statement: "A fabricated promotion is refused. A manifest claiming a HUMAN_PROMOTION whose decision_id does not resolve in the ledger is rejected at registration."
    proof: "Negative test asserting DENY_UNAPPROVED_PUBLICATION."
  - id: "AC-VS-06"
    statement: "A reverted or expired decision denies. resolveEffective at an instant after expiry must not authorize."
    proof: "Negative test at an instant past valid_until."
  - id: "AC-VS-07"
    statement: "An out-of-scope caller is withheld the pilot skill, and the withheld tally stays invariant to the query."
    proof: "Existing AC-SKILLS-HUB-06a extended to cover a populated registry - the oracle regression must hold when there is something real to hide."
  - id: "AC-VS-08"
    statement: "Revoking the pilot decision denies the next resolution with no restart."
    proof: "Append a REVOCATION, assert the next resolveSkill denies."
  - id: "AC-VS-09"
    statement: "The pilot package carries no contradiction between its declared authority ceiling and its own controls."
    proof: "13 of 22 packages declare a cap permitting mutation (A2/A3) while their own controls.repository_mutation says prohibited, and 3 declare R0 with A2. The pilot MUST be chosen from the 9 R0/A1 packages that are internally consistent. A test asserts the chosen pilot is not in the contradictory set."
  - id: "AC-VS-10"
    statement: "npm run validate exits 0 and the suite exits 0, both judged by EXIT CODE."
    proof: "Producer-run, recorded as evidence not acceptance. A grep for a FAIL status is not evidence - validate-foundation.mjs throws and never emits one (DEF-M1)."

test_plan:
  - "Positive: the full chain to ALLOW, mirroring tests/conformance-stubs.test.mjs V-013 but through the production wiring rather than a test-local resolver."
  - "Negative: fabricated promotion; expired decision; revoked decision; out-of-scope project, runtime and data class; grant field sourced from package content."
  - "Regression: the entire existing SkillsHub suite, including the identity-binding pins, the withheld-count oracle pin, and AC-SKILLS-HUB-11 getSkill unreachability."
  - "Sabotage: for EVERY control added, remove it and confirm the suite exits 1, then restore and confirm exit 0. A control that has not been seen to fail is not evidence (DEF-M1)."

review_plan:
  - "REV: hunt for any path by which package content reaches a grant field in a registered manifest. That is the whole safety claim of this slice."
  - "REV: confirm the pilot decision was signed by someone other than the producer."
  - "QA: re-run validate and the suite at the delivered commit by exit code, and independently re-run the sabotage matrix."

security_plan:
  - "SEC review is REQUIRED before merge, not after: this slice opens the DEF-A8 registry gate, which the DEF-C3 ruling made a gated action."
  - "SEC question 1: with the registry populated, does the DEF-C3 classification inversion become live? The ruling's condition 2 requires the call-site fix; that fix is in src/mcp and is prohibited to this producer. If it has not landed, SEC must decide whether the slice may proceed with one skill or must wait."
  - "SEC question 2: does the promotion path fully close DEF-A5 for the legacy contract, or does a residual path remain by which package content reaches a scope field?"
  - "Secret scan over all changed files before handoff."

evidence_destination: "SecB Evidence Ledger - accepted by the Evidence authority, not by the producer"

human_approval_requirements:
  - "GOV authorization to begin: NOT GRANTED. Required before any file is written."
  - "GOV signature on the pilot promotion decision: NOT GRANTED. This is the human promotion the whole lifecycle exists to protect and may not be minted by the producer."
  - "SEC clearance to populate the resolver registry: NOT GRANTED. This is the DEF-A8 gate."
  - "GOV approval to merge: NOT GRANTED."

schedule:
  execution_window_opens: "On GOV authorization"
  expiry: "Authorization lapses if not started within 30 days, or on any change to the DEF-C3 ruling."
budget: "Not tracked. This slice is small by construction; if it grows, that is evidence the scope was wrong."

checkpoint_rules:
  - "Checkpoint after the promotion path exists and before any decision is minted."
  - "Checkpoint before the first registerSkill call in production wiring - that call is the DEF-A8 gate crossing."
  - "STOP if the slice cannot be completed without changing a contract. contracts/** is prohibited, and the urge to change one is the signal that this slice is being used to justify the tier work rather than to deliver a working skill."
rollback_plan: >-
  Two reversible layers. The code is a git revert. The minted decision is an
  append-only ledger entry that cannot be deleted - it is reverted by appending a
  REVOCATION, which AC-VS-08 already requires to be tested. Rollback therefore
  exercises a control rather than bypassing one.
recovery_rules:
  - "On interruption before the gate crossing, resume from the last checkpoint; no ledger state exists yet."
  - "On interruption after, the ledger is authoritative and the revocation path is the only way back."
integration_rules:
  - "Rebase onto the branch tip before handoff. src/mcp conflicts indicate a scope breach, not a merge to resolve."
activation_rules:
  - "This slice activates one skill for one project scope. It does not declare the SkillsHub operational, and MOD-SKILL remains QUEUED - partial."

learning_obligations:
  - "Record whether the promotion path actually prevented package content from reaching a grant field, or merely relocated the obligation. That is the load-bearing claim, and the producer has been wrong about exactly this class of claim five times."
  - "Record how much of the 12-work-package horizontal plan turned out to be necessary once one skill actually worked."

