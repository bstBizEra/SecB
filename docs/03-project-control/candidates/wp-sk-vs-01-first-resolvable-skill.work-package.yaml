schema_version: "0.1"
record_metadata:
  record_id: "wp_sk_vs_01_first_resolvable_skill_v1_candidate"
  record_status: "WITHDRAWN_BY_PRODUCER"
  source_template: "docs/templates/work-package.yaml"
  producer_runtime: "Claude Code"
  limitations:
    - "The producer of this work package is also its assigned ENGIN. It may not review or accept its own output."
    - "The producer has been returned by independent review five consecutive rounds, twice for asserting in a governance record that a control had a property the code did not have. Acceptance criteria below are written to be machine-checkable, and each must be shown to FAIL when its control is removed before it is claimed."
    - "The producer has four times asserted that something did not exist when it did - most recently DecisionLedger, which exists and is already exercised end-to-end by tests/conformance-stubs.test.mjs. Absence claims in this document should be re-derived, not trusted."

withdrawal:
  withdrawn_at: "2026-08-02"
  withdrawn_by: "producer, before authorization - no signature was given"
  reason: >-
    Its central acceptance criterion is built on a premise that is false.
    AC-VS-01 claimed that constructing the governed manifest from a decision
    rather than from package content closes DEF-A5. DEF-R1 shows the hole is not
    in who writes the manifest: contracts/decision-record.schema.json cannot name
    a skill, so SkillResolver checks only that a decision with the claimed id
    exists and is typed GOVERNANCE. One decision authorizes any skill at any
    scope - reproduced by registering an unrelated skill and a self-widened
    RESTRICTED grant off a single decision. The producer was looking at the wrong
    end of the chain.
  other_falsified_content:
    - "AC-VS-01 is also unimplementable as written: a decision record has no field able to carry project_scopes, supported_runtimes or max_data_classification, and contracts/** was prohibited by this work package - so its own STOP checkpoint fires on its own central criterion."
    - "The rollback plan asserted that appending a REVOCATION reverts the promotion. REVOCATION is not in the DecisionLedger decision_type enum, and resolveSkill did not consult the ledger at all. AC-VS-08 was unsatisfiable at the time of writing. WP-SK-R2 has since made the resolution-time half true; the enum half remains false."
    - "schedule.expiry lapsed the authorization on any change to the DEF-C3 ruling, while proceeding required amending that ruling - the work package triggered its own lapse clause."
    - "The premise that it does not depend on the contract tier split is wrong: skill-grant-record.schema.json is the only shape that can express RESTRICTED_PUBLICATION, which the lifecycle requires before general publication."
  retained_because: >-
    The record of a proposal that reached a signature request on a false premise
    is evidence about how this programme fails, and deleting it would remove the
    only trace. It is marked WITHDRAWN rather than removed.
  superseded_by: >-
    Nothing yet. A first-promotion work package needs DEF-R1 closed first, which
    is a contract change and belongs to ARCHI.

work_package_id: "WP-SK-VS-01"
project_id: "prj_secb_local"
product_id: "SECB-PRD-SKILLSHUB-001"
module_id: "MOD-SKILL"
goal_id: "GATE-SK-07"
title: "First resolvable skill - vertical slice"

objective: >-
  Make ONE skill resolvable end to end through governance, so that
  secb_skill_hub_search returns a real authorized result for the first time.

problem_statement: >-
  Zero skills are consumable. Every component on the path exists and is tested -
  DecisionLedger, appendDecision, resolveEffective, SkillResolver.registerSkill,
  the fail-closed hub gate, the MCP tool - and tests/conformance-stubs.test.mjs
  V-013 already drives the whole chain to ALLOW. What is missing is production
  wiring: both wirings pass `decisionLookup: () => null`, nothing calls
  registerSkill outside tests, and no governance decision exists for any skill.

  Separately, the programme has spent five review rounds on a contract tier split
  that no runtime path consumes. The resolver still validates against the legacy
  skill-manifest contract. That work is a design improvement to an unused
  surface; it is not on the path to a working SkillsHub, and this work package
  does not depend on it.

desired_outcome: >-
  One low-risk skill resolves ALLOW for an authorized caller and is withheld from
  an unauthorized one, on the strength of a real governance decision that
  resolves in the DecisionLedger.

non_goals:
  - "The contract tier split. AC-05, AC-08, risk_class re-tiering, the tier-separation control rewrite, and DEF-D8/DEF-D9 are findings pending ruling, NOT blockers for this slice."
  - "Building intake, an evaluation runner, or the distribution service. This slice mints ONE decision by hand under GOV authorization; it does not automate promotion."
  - "Editing .agents/ - PACK.yaml declares mutation_authorized: false."
  - "Editing src/mcp/ - concurrent work by another producer. The one DEF-C3 call-site fix this slice depends on is REPORTED to that producer, not made here."
  - "Publishing more than one skill. The corpus stays at zero-plus-one."

risk_class: "R3"
mutation_class: "M3"
mutation_rationale: >-
  M3, not M2. This slice mints a GOVERNANCE decision into the DecisionLedger - an
  authoritative append-only system of record - and populates the resolver
  registry. WP-SK-01 was M2 because it wrote only contracts. Writing a governance
  decision is integration-candidate creation at minimum. GOV should set this
  class rather than accept the producer's proposal: an agent may not self-upgrade
  mutation authority, and proposing one is the closest a producer may come.

