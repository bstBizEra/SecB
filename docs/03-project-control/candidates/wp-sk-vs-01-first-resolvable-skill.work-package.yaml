  reason: >-
    The plan was drawn from the contract downward and did not contain the three
    things actually missing - wiring, a caller, and a decision. Five review rounds
    went into a surface nothing consumes. The remaining horizontal work packages
    are demoted to a backlog and are not blockers.
  wp_sk_01_status: >-
    Its GOV authorization LAPSED by its own terms. WP-SK-01 sets
