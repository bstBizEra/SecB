authority_note: >-
  R3 because it changes contracts/decision-record.schema.json, which nearly
  every governed act flows through, and it changes what the resolver will
  accept. M3 for the same reason.

  What makes it small is that it RELAXES a requirement, so nothing existing
  breaks, and the resolver already denies the case being made expressible.

  What makes it worth doing is that a governance system whose records cannot say
  no is not a governance system. Today every decision that mentions a skill
  version grants it, including the ones written to refuse it.
