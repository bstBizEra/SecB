authority_note: >-
  R2 and M2: a new tool and its tests, touching no guard, no contract and no
  source. It is filed for authorization rather than built under the pre-authorized
  bounded-slice path because the producer has already built one tool this session
  without a package, and because the operator asked for this one as a package.

  The check it adds is small. What it protects is not: byte-identity guards are
  the only mechanism in this repository that notices a governed file changing
  without authorization, and exclusions erode them one correct decision at a time.
