architecture_options:
  - option: "A. Thin facade over generic TransitionEngine - WorkPackageService delegates all state changes to the existing TransitionEngine as-is"
    benefits:
      - "Smallest code footprint; single transition code path for all contract types"
      - "Fast to implement; reuses existing envelope, policy ALLOW, and fingerprint plumbing"
    risks:
      - "Inherits TransitionEngine's known weaknesses: less strict scalar validation and caller-derived timestamps, both below the accepted P0-08 hardening bar"
      - "Authorization and acceptance semantics (SoD, evidence sufficiency, baseline binding, expiry) leak into a generic engine not designed to be authoritative for them"
      - "A generic-engine bug becomes a cross-cutting authorization bypass affecting every contract type at once"
  - option: "B. Dedicated WorkPackageContractService replicating P0-08 hardened patterns, bypassing TransitionEngine entirely"
    benefits:
      - "Full control: closed-schema validation, server-derived timestamps, canonical fingerprints, fail-closed resolution exactly as accepted in P0-08"
      - "No dependency on hardening a shared component; P0-09 risk is isolated"
    risks:
      - "Duplicates transition logic; two divergent state machines for the same lifecycle over time"
      - "Undermines the architectural purpose of a generic TransitionEngine and creates drift the Immune layer must then police"
  - option: "C. Dedicated WorkPackageContractService as the sole authoritative boundary, delegating mechanical state-graph checks to TransitionEngine only after a hardening gate brings it to P0-08 parity; until parity, the service performs its own hardened pre-validation and treats the engine result as necessary-but-not-sufficient"
    benefits:
      - "Preserves single generic transition substrate long-term while never trusting it beyond its current hardening level"
      - "Service layer owns everything domain-specific: authority binding, SoD, evidence sufficiency, baseline/expiry binding, acceptance independence - the engine only ever answers 'is this edge legal'"
      - "Fail-closed by construction: both the service's hardened checks and the engine must pass; either denial denies"
      - "Provides a concrete, testable hardening contract for TransitionEngine (V-items) instead of an implicit assumption"
    risks:
      - "Double validation adds modest complexity and requires an explicit rule for which layer is authoritative on conflict (service denies wins)"
      - "Requires a defined hardening backlog for TransitionEngine before the pre-validation shim can be retired"

recommended_option: "C"

service_contract:
  authoritative_record: "Immutable, versioned WorkPackage contract record keyed by (project_id, work_package_id, version); full closed schema (identity, version, project, objective, risk, status, baseline commit, scope, non-scope, acceptance criteria, roles, allowed/prohibited paths, evidence obligations, expiry) plus an append-only decision/transition ledger; canonical SHA-256 content fingerprint computed server-side at creation; records deep-cloned on read and frozen in memory; the ledger, not any mutable status field, is the source of truth - current state is derived by replaying the ledger"
  public_operations:
    - "createWorkPackage(draft) - closed-schema validated, initial state DRAFT only, unique (identity, version), server timestamp, canonical fingerprint"
    - "submitTransition(envelope) - single entry point for all lifecycle moves (PLAN, REVIEW, AUTHORIZE, READY, RUN, SELF_VERIFY, QA, GOV_DECIDE, ACCEPT, REWORK, BLOCK, QUARANTINE, CANCEL, REVOKE); string-only idempotency key; canonical envelope fingerprint"
    - "getWorkPackage(project_id, work_package_id, version?) - deep-cloned read of a specific or latest version"
    - "resolveEffective(project_id, work_package_id) - fail-closed effective resolution (see rules)"
    - "getDecisionLedger(project_id, work_package_id) - append-only audit read"
  effective_resolution:
    - "Effective work package = highest version whose ledger derives state AUTHORIZED-or-later and that has not reached a terminal or revoking state; absence of any such version resolves to NONE (fail closed), never to a draft or best-effort fallback"
    - "Expiry check is evaluated at resolution time against server clock: an expired authorization resolves to NONE regardless of stored state"
    - "Baseline binding is evaluated at resolution time: if the recorded accepted baseline does not match the baseline the caller asserts it is executing against, resolution denies"
    - "Effective authority is server-derived from AuthorityEngine grants at resolution time, never taken from the request; a grant that has lapsed or lost SoD validity denies even if the stored state is AUTHORIZED"
    - "Any validation error, unknown state, ledger gap, or fingerprint mismatch resolves to NONE with a typed denial reason - no partial results"

state_authority_invariants:
  - "Only the canonical lifecycle edges are legal: DRAFT->PLANNED->REVIEWED->AUTHORIZED->READY->RUNNING->SELF_VERIFIED->REVIEW->QA->GOV_DECISION->ACCEPTED plus defined REWORK/BLOCKED/QUARANTINED/CANCELLED/REVOKED exits; any other edge is denied, including same-state no-ops"
  - "Role gates are server-enforced per AuthorityEngine: ENGIN required for RUNNING and SELF_VERIFIED; REV for REVIEW; QA for QA; GOV for GOV_DECISION and ACCEPTED; the service never infers roles from the envelope"
  - "Grants must bind actor+project+work_package+role+transition and be within validity window at the server-observed decision time"
  - "Separation of duties: the actor who drove RUNNING/SELF_VERIFIED for a version cannot be the effective actor for that version's REVIEW, QA, or GOV_DECISION; QA actor must differ from REVIEW actor; GOV actor must differ from both"
  - "AUTHORIZED means permission-to-prepare bound to a specific version+baseline+expiry; READY means preconditions (paths, grants, obligations declared) verified; RUNNING means execution window open under ENGIN; ACCEPTED means GOV has ruled evidence sufficient - these are distinct decisions by distinct authorities and none implies another"
  - "REVOKE is a GOV-only action valid from any post-AUTHORIZED non-terminal state and is terminal; CANCEL is valid only from pre-AUTHORIZED states (or by GOV afterwards) and is terminal; neither is ever reversible in place - recovery requires a new version starting at DRAFT"
  - "All timestamps in the ledger are server-derived; caller-supplied timestamps in envelopes are ignored for authority/expiry evaluation and retained only as claimed metadata"
  - "New versions always start at DRAFT; no version inherits lifecycle position from a predecessor"

acceptance_and_evidence_invariants:
  - "Each declared evidence obligation must be satisfied by at least one evidence item with source, server timestamp, agent identity, and content fingerprint before GOV_DECISION may be entered; unsatisfied obligations deny the transition, not merely warn"
  - "Acceptance independence: evidence produced solely by the executing actor (SELF_VERIFIED artifacts) can satisfy self-verification obligations only; REVIEW, QA, and GOV obligations each require evidence attributable to an actor independent of execution under the SoD matrix"
  - "GOV_DECISION records an explicit typed outcome (ACCEPT, REWORK, QUARANTINE, REVOKE) with rationale; ACCEPTED state is reachable only via a recorded ACCEPT outcome - never directly"
  - "Evidence items are append-only, fingerprinted, and bound to (work_package_id, version, baseline); evidence bound to a different version or baseline does not count"
  - "Decisions are unique per (version, decision_type, authority): a second conflicting GOV decision for the same version is denied as a conflict, not merged"
  - "Expiry passing while in any pre-ACCEPTED state blocks all forward transitions except REWORK-to-new-version, CANCEL, or REVOKE"

negative_test_matrix:
  - "Create with any missing/extra/empty schema field, non-string scalar, or initial state other than DRAFT -> typed denial"
  - "Create with duplicate (identity, version) -> conflict denial; replay of identical create envelope -> identical original result"
  - "Transition with non-string idempotency key, or same key with different envelope fingerprint -> conflict denial; same key + same fingerprint -> stable replay of original outcome"
  - "Illegal edge (e.g., DRAFT->RUNNING, AUTHORIZED->ACCEPTED, ACCEPTED->anything) -> denial"
  - "Correct edge, wrong role (e.g., REV actor attempting RUNNING; ENGIN attempting GOV_DECISION) -> denial"
  - "Correct role, grant expired / wrong project / wrong work package / wrong transition binding -> denial"
  - "SoD violation: executor attempting own REVIEW, QA, or GOV_DECISION; REVIEW actor reused for QA -> denial"
  - "GOV_DECISION attempted with any unsatisfied evidence obligation, or with evidence bound to another version/baseline -> denial"
  - "Second GOV decision with a different outcome for same version -> conflict denial"
  - "Transition attempted after expiry timestamp (server clock) -> denial except REWORK/CANCEL/REVOKE paths"
  - "resolveEffective with no AUTHORIZED+ version, with expired authorization, with baseline mismatch, or with tampered/mismatched fingerprint -> NONE with typed reason"
  - "Caller-supplied timestamps attempting to backdate around expiry or grant windows -> ignored; evaluation uses server time -> denial"
  - "Mutation attempt on a returned record does not affect stored state (deep clone/freeze verified)"
  - "TransitionEngine returning ALLOW where the service's hardened pre-validation denies -> service denial wins (fail-closed composition test)"

