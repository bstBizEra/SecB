blocking_decisions_for_human_gov:
  - id: "GOV-P009-01"
    question: "Approve service boundary option C (dedicated authoritative service with hardened pre-validation over TransitionEngine, engine result necessary-but-not-sufficient until parity), or mandate A or B?"
    recommendation: "Approve option C; it is the only option that is fail-closed today and convergent with the generic engine long-term"
  - id: "GOV-P009-02"
    question: "Must TransitionEngine hardening (strict scalars, server timestamps) be completed and accepted before R2 implementation of P0-09, or may P0-09 ship with the service-side pre-validation shim compensating?"
    recommendation: "Allow shim-compensated R2 with hardening as a tracked V-item gate before any production declaration; do not couple P0-09 delivery to engine hardening, but do couple production to it"
  - id: "GOV-P009-03"
    question: "Expiry semantics: does authorization expiry auto-transition the record (e.g., to BLOCKED) or remain deny-on-use with state unchanged?"
    recommendation: "Deny-on-use with resolution-time enforcement; no timer-driven mutation (keeps ledger append-only and avoids background writers)"
  - id: "GOV-P009-04"
    question: "Confirm the SoD matrix strictness: executor excluded from REVIEW, QA, and GOV; REVIEW/QA/GOV pairwise distinct - is this the binding minimum?"
    recommendation: "Adopt as binding minimum; relaxations require explicit GOV grant recorded in the ledger"
  - id: "GOV-P009-05"
    question: "Version supersession: when a new version reaches AUTHORIZED, is the prior version's authorization implicitly revoked, or may two authorized versions coexist?"
    recommendation: "Implicit supersession - at most one effective version per work package; coexistence requires explicit GOV exception"
  - id: "GOV-P009-06"
    question: "Baseline binding: is authorization bound to the exact accepted baseline commit (deny on any mismatch), or to baseline-or-descendant?"
    recommendation: "Exact-commit binding for R2; descendant policies deferred until a verified ancestry check exists"

non_blocking_risks:
  - id: "RISK-P009-01"
    statement: "Double validation (service + engine) may drift apart, producing edges legal in one layer and not the other"
    mitigation: "Single data-driven edge table consumed by both layers; conformance test asserts table parity every run"
  - id: "RISK-P009-02"
    statement: "P0-08 is accepted but not integrated; P0-09 may replicate patterns that change during P0-08 integration"
    mitigation: "Bind P0-09 pattern references to the accepted P0-08 baseline fingerprints; re-review on any P0-08 integration change"
  - id: "RISK-P009-03"
    statement: "Append-only ledger replay cost grows with transition count"
    mitigation: "Cached derived-state snapshot keyed by ledger fingerprint; snapshot is an optimization only, never authoritative"
  - id: "RISK-P009-04"
    statement: "Closed schema may need new fields (e.g., evidence obligation typing) causing version churn"
    mitigation: "Schema versioned alongside contract version; additive extension via new schema version, never in-place widening"

