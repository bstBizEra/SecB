evidence_obligations:
  - "The AC-AUDIT-01 calibration report: seed classes, seed count, per-class detection rate, false positives, and the answer key, held by REV."
  - "The AC-AUDIT-02 control matrix: for every check, the input that trips it and the input that does not, with outcomes."
  - "Per-lens evidence manifests demonstrating AC-AUDIT-03 divergence."
  - "The before-and-after .agents/ digests and git status for AC-AUDIT-07."
  - "A statement of every coverage bound the run hit, per AC-AUDIT-06, including runs where none were hit."

valid_until: "2026-11-03T00:00:00Z"

design_note: >-
  The deterministic layer is not the audit. It is the evidence pack the
  autonomous auditor reasons over.

  Facts that are decidable - hashes, coverage, structural conformance, diffs,
  invocation-log comparisons - are computed, because an LLM performing them is
  slower, more expensive, and capable of producing a plausible wrong hash.
  Judgement that is not decidable - whether an instruction exceeds a declared
  authority boundary, whether an eval case could ever fail, whether two packages
  conflict in intent - goes to the auditor, over computed facts so it never has
  to guess at something already known.

  This split is the design's main quality lever, and it is drawn from observed
  behaviour rather than principle: across this branch's review history the agent
  reviews that held up were the ones that ran a probe before concluding, and the
  ones that failed were the ones that read and inferred.

  The event-driven trigger is what makes the audit natural rather than
  ceremonial. An audit that runs on a schedule reports on a corpus nobody
  changed. An audit that fires when a file changes, or when the invocation log
  shows a tool used outside a declared inventory, is reporting on the thing that
  just happened - and its cost scales with change rather than with corpus size.
