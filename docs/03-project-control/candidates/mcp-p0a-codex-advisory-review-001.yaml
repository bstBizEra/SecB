    - finding_id: "REV-MCP-P0A-001"
      severity: "HIGH"
      title: "Caller-controlled hooks can escape the structured fail-closed boundary"
      evidence:
        - "policy.allow() exceptions escape invoke() instead of returning a structured denial."
        - "The injected clock can throw before audit and escape invoke()."
        - "An asynchronous adapter rejection is returned inside an ok:true result and later becomes an unhandledRejection."
      violated_claims:
        - "Work-package acceptance: every deny path returns a structured deny code; no throw escapes invoke()."
        - "Gateway core comment: never throws for a caller-supplied condition."
      required_rework:
        - "Make the dispatch boundary asynchronous and await adapter invocation."
        - "Convert policy, clock, audit, and adapter failures to stable structured denials without exposing raw error text."

    - finding_id: "REV-MCP-P0A-002"
      severity: "CRITICAL"
      title: "The narrowing-only policy hook can mutate capability routing and widen authority"
      evidence:
        - "policy.allow(context, capability) receives the mutable registry object after the read-only check."
        - "A policy hook can change adapter_id and tool, return true, and cause dispatch to a different adapter without a second access check."
      violated_claims:
        - "Policy only narrows."
        - "N-3 server/tool allowlists and read/write classification are enforced fail-closed."
      required_rework:
        - "Snapshot and deep-freeze validated context and capability data before invoking policy or adapters."
        - "Resolve routing from the immutable validated snapshot and reject any mutation or mismatch."

    - finding_id: "REV-MCP-P0A-003"
      severity: "HIGH"
      title: "Adapter mutation can forge receipt attribution"
      evidence:
        - "The adapter receives the original mutable request_context."
        - "Changing work_package_id or session_id inside the adapter changes the emitted receipt while the audit entry retains the original values."
      violated_claims:
        - "N-2 request_context binding."
        - "Receipt provenance and attribution integrity."
      required_rework:
        - "Use an immutable cloned context for policy and adapter calls."
        - "Build audit and receipt records from the same pre-dispatch immutable snapshot."

    - finding_id: "REV-MCP-P0A-004"
      severity: "HIGH"
      title: "Denied attempts are not audited"
      evidence:
        - "Missing context, unknown capability, non-read access, policy denial, and missing adapter return before invocationLog is called."
        - "An unknown-capability probe produced zero audit entries."
      violated_claims:
        - "Every invocation attempt is audit-first."
        - "SecB fail-closed evidence preservation expectations."
      required_rework:
        - "Record both ALLOW and DENY dispositions for every invocation attempt using a privacy-bounded audit envelope."
        - "Define behavior for audit failure on pre-dispatch denials without accidentally dispatching."

    - finding_id: "REV-MCP-P0A-005"
      severity: "HIGH"
      title: "Raw backend error messages cross the gateway boundary"
      evidence:
        - "Adapter and invocation-log error.message values are interpolated into caller-visible denials."
        - "A synthetic adapter error containing token=super-secret-value was returned verbatim."
      violated_claims:
        - "N-3 output redaction."
        - "Credential isolation and no-token-passthrough posture."
      required_rework:
        - "Return stable public error codes and generic messages."
        - "Route sanitized diagnostic detail only to an approved evidence sink."

